<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki · The Serpent's Oath</title>
<meta name="description" content="The Serpent's Oath wiki: every monster, weapon, armour set, skill, mount, town, person and dungeon of the game, in English and Hebrew.">
<meta name="theme-color" content="#1a0f17">
<meta property="og:title" content="The Serpent's Oath · Wiki">
<meta property="og:description" content="Every monster, weapon, set, skill, mount, person and place in the game.">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/logo/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="lang.css">
<style>
/* The wiki, in the satchel's language (site.css holds the shared tokens, bar, panels, buttons and foot): every card is
   an item slot with its rarity ring, every detail opens as the satchel's hover card.
   Its data and pictures come from the game itself (tools/site/wiki-gen.mjs in the game repo writes wiki/data.json and wiki/img/). */
html { scroll-padding-top: 130px; }
a, button, summary, label, .card, [role="button"] { cursor: var(--cur-hand); }
.px { image-rendering: pixelated; }
.bar { box-shadow: 0 1px 0 var(--edge); } /* (the rail below carries the line) */

/* ---------- wiki head: title and the search field ---------- */
.whead { position: relative; display: grid; justify-items: center; gap: 12px; padding: 36px var(--gut) 24px; text-align: center; }
.whead h1 { margin: 0; font: 700 clamp(40px, 7vw, 68px)/1.1 var(--font-title); color: var(--gold); letter-spacing: .03em;
  text-shadow: 3px 0 0 #1a0f17, -3px 0 0 #1a0f17, 0 3px 0 #1a0f17, 0 -3px 0 #1a0f17, 3px 3px 0 #1a0f17, -3px 3px 0 #1a0f17, 3px -3px 0 #1a0f17, -3px -3px 0 #1a0f17, 0 7px 0 #6b4024, 0 10px 0 #1a0f17; }
html[lang="he"] .whead h1 { letter-spacing: 0; }
.whead .hline { width: min(420px, 70vw); height: 1px; background: linear-gradient(to right, transparent, var(--line-hi), transparent); }
.whead p { margin: 0; max-width: 64ch; color: var(--tx-2); text-wrap: balance; }
.search { position: relative; width: min(640px, 100%); margin-top: 6px; }
.search input { width: 100%; min-height: 52px; padding: 12px 18px; padding-inline: 48px 52px; font: 500 17px/1.2 var(--font-body); color: var(--parch-hi);
  background: linear-gradient(180deg, rgba(20, 12, 17, .9), rgba(30, 19, 26, .9)); border: 0; border-radius: var(--rad-box);
  box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--line-hi), inset 0 2px 6px rgba(0, 0, 0, .4); -webkit-appearance: none; appearance: none; transition: box-shadow .14s; }
.search input:focus { outline: none; box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--gold), var(--sh-glow); }
.search input::placeholder { color: var(--tx-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search .mag { position: absolute; inset-inline-start: 16px; top: 50%; width: 20px; height: 20px; margin-top: -10px; pointer-events: none; color: var(--bronze-hi); }
.search .clear { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); display: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--rad-btn);
  background: rgba(255, 255, 255, .06); color: var(--parch-hi); box-shadow: inset 0 0 0 1px var(--line-mid); font-size: 18px; line-height: 1; }
.search .clear:hover { background: rgba(255, 255, 255, .12); }
.search.has .clear { display: block; }
.hint { font-size: 13.5px; color: var(--tx-3); }

/* ---------- the category rail: the satchel's section tabs (sticky under the bar) ---------- */
.rail { position: sticky; top: var(--bar-h); z-index: 25; display: flex; gap: 4px; padding: 6px var(--gut) 8px; overflow-x: auto; scrollbar-width: none; justify-content: safe center;
  background: linear-gradient(180deg, rgba(27, 17, 23, .94), rgba(27, 17, 23, .9)); box-shadow: inset 0 -1px 0 var(--line), 0 6px 18px rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.rail::-webkit-scrollbar { display: none; }
.rail a { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: var(--rad-btn); text-decoration: none; color: var(--tx-2); font: 600 14px/1 var(--font-body); white-space: nowrap; background: rgba(0, 0, 0, .25); }
.rail a:hover { color: var(--parch-hi); background: rgba(255, 255, 255, .06); }
.rail a[aria-current="page"] { color: var(--parch-hi); background: linear-gradient(var(--tab-a), var(--tab-b)); box-shadow: inset 0 0 0 1px var(--line-hi); }
.rail a b { font: 400 9px/1 var(--font-num); color: var(--tx-3); }
.rail a[aria-current="page"] b { color: var(--gold); }
.rail svg { width: 17px; height: 17px; flex: none; color: var(--bronze-hi); opacity: .75; }
.rail a[aria-current="page"] svg { opacity: 1; color: var(--gold); }

/* ---------- sections ---------- */
main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 30px var(--gut) 40px; display: grid; gap: 36px; min-height: 60vh; }
.sub { display: grid; gap: 14px; min-width: 0; }
.sub > h3 { margin: 0; display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; font: 700 19px/1.2 var(--font-title); color: var(--gold); letter-spacing: .03em; text-shadow: 0 2px 0 #000; border-bottom: 1px solid var(--line-lo); }
html[lang="he"] .sub > h3 { letter-spacing: 0; }
.sub > h3 small { padding: 3px 6px 2px; border-radius: var(--rad-key); font: 400 10px/1 var(--font-num); color: var(--parch-2); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line); text-shadow: none; letter-spacing: 0; }
.lead { margin: 0; color: var(--tx-2); max-width: 75ch; }
.parch a { color: var(--gold); font-weight: 600; }

/* filter chips: the satchel's sort pill */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; font: 600 13px/1 var(--font-body); color: var(--tx-2);
  background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line); }
.filters button:hover { color: var(--parch-hi); background: rgba(255, 255, 255, .1); }
.filters button[aria-pressed="true"] { color: var(--parch-hi); background: linear-gradient(var(--tab-a), var(--tab-b)); box-shadow: inset 0 0 0 1px var(--gold); }
.filters button b { font: 400 9px/1 var(--font-num); opacity: .8; }

/* ---------- cards: an item slot (rarity ring, dark inner ring) over its name, on a small satchel panel ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
.card { --rc: var(--r-common); position: relative; display: grid; grid-template-rows: auto 1fr; padding: 6px; text-align: start; color: var(--tx); text-decoration: none;
  border-radius: 14px; background: linear-gradient(180deg, var(--card-2), var(--card)); box-shadow: var(--sh-card); transition: transform .14s ease-out, box-shadow .14s ease-out; }
.card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--gold), var(--sh-glow), 0 10px 26px rgba(0, 0, 0, .45); outline: none; }
.card.r-epic { --rc: var(--r-epic); } .card.r-legendary { --rc: var(--r-legendary); } .card.r-quest { --rc: var(--r-quest); }
.card .well { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; overflow: hidden; border-radius: var(--rad-slot);
  background: radial-gradient(ellipse 70% 60% at 50% 58%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 75%), radial-gradient(ellipse at 50% 85%, #3f2a33 0%, var(--slot) 55%, #241820 100%);
  box-shadow: inset 0 0 0 2px var(--rc), inset 0 0 0 3px var(--ring-dk), inset 0 -12px 18px rgba(0, 0, 0, .25); }
.card:hover .well { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 3px var(--ring-dk), inset 0 -12px 18px rgba(0, 0, 0, .25); }
.card .well img { position: relative; width: 96px; height: 96px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); }
.card .well img.ico { width: 72px; height: 72px; }
.card .well.lineup { display: flex; justify-content: center; align-items: center; } /* a town's people, side by side at their true pixel size */
.card .well.lineup img { flex: none; width: 36px; height: 96px; object-fit: none; margin-inline: -1px; }
.card .well .ph { position: relative; width: 40px; height: 40px; color: var(--bronze-hi); opacity: .35; } /* no picture: the category's pixel sign */
.card .well .ph svg { width: 100%; height: 100%; }
.card .well .lv { position: absolute; inset-inline-start: 6px; top: 6px; padding: 3px 5px 2px; border-radius: var(--rad-key); font: 400 9.5px/1.2 var(--font-num); color: var(--parch-hi); background: rgba(13, 7, 11, .78); box-shadow: inset 0 0 0 1px var(--line-mid); direction: ltr; }
.card .well .tag { position: absolute; inset-inline-end: 6px; top: 6px; padding: 2px 6px; border-radius: 5px; font: 700 11px/1.3 var(--font-body); color: #1a0f17; background: var(--gold); }
.card .well .tag.boss { background: #c23a33; color: #fff; box-shadow: inset 0 0 0 1px #ff8a7a; }
.card .txt { display: grid; align-content: start; gap: 3px; padding: 9px 6px 4px; }
.card .nm { font: 700 15px/1.25 var(--font-body); color: var(--parch-hi); }
.card.r-epic .nm, .card.r-legendary .nm { color: var(--rc); }
.card .mt { font-size: 12.5px; color: var(--tx-2); line-height: 1.4; }
.icons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.icons img { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 6px; background: var(--slot); box-shadow: inset 0 0 0 1px var(--line-mid); }
.swatch { display: flex; height: 6px; margin-top: 6px; border-radius: 3px; overflow: hidden; } .swatch i { flex: 1; }

/* rows (people, quests, families): the satchel's quest list */
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; padding-inline: 8px 12px; text-align: start; color: var(--tx);
  border-radius: var(--rad-box); background: rgba(255, 255, 255, .03); box-shadow: inset 0 0 0 1px var(--line-lo); }
.row > img { width: 52px; height: 52px; padding: 2px; image-rendering: pixelated; border-radius: var(--rad-slot); background: radial-gradient(circle at 50% 60%, #3f2a33, var(--slot) 70%); box-shadow: inset 0 0 0 2px var(--r-common), inset 0 0 0 3px var(--ring-dk); }
/* a townsperson's own portrait at its true pixel size (the figure is tall: the slot crops the empty sides) */
.row.face > img { width: 72px; height: 96px; padding: 0; object-fit: none; background: radial-gradient(ellipse 60% 45% at 50% 62%, rgba(255, 206, 120, .14), transparent 75%), radial-gradient(ellipse at 50% 85%, #3f2a33 0%, var(--slot) 60%); }
.row .nm { font: 700 15px/1.25 var(--font-body); color: var(--parch-hi); }
.row .mt { font-size: 13px; color: var(--tx-2); }
.row .end { font: 400 10px/1.4 var(--font-num); color: var(--tx-3); text-align: end; direction: ltr; }
.rar { font-weight: 700; } .rar.normal { color: var(--parch-2); } .rar.epic { color: #c79bff; } .rar.legendary { color: var(--r-legendary); }
.dot { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-inline-end: 4px; border-radius: 3px; box-shadow: 0 0 0 2px var(--ring-dk); }
.row > .dot { border-radius: var(--rad-slot); }

/* the overview: one satchel panel per category, its picture in a slot */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.cat { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; padding: 14px 16px 14px 14px; padding-inline: 14px 16px; text-decoration: none; transition: transform .14s ease-out, box-shadow .14s ease-out; }
.cat:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--gold), var(--sh-glow), 0 12px 30px rgba(0, 0, 0, .45); }
.cat .pics { position: relative; width: 84px; height: 84px; display: grid; place-items: center; border-radius: var(--rad-slot);
  background: radial-gradient(circle at 50% 58%, rgba(255, 178, 46, .2), transparent 70%), var(--slot); box-shadow: inset 0 0 0 2px var(--r-legendary), inset 0 0 0 3px var(--ring-dk); }
.cat .pics img { width: 72px; height: 72px; image-rendering: pixelated; }
.cat h3 { margin: 0; font: 700 19px/1.15 var(--font-title); color: var(--gold); letter-spacing: .03em; text-shadow: 0 2px 0 #000; }
html[lang="he"] .cat h3 { letter-spacing: 0; }
.cat p { margin: 3px 0 0; font-size: 13.5px; color: var(--tx-2); line-height: 1.45; }

/* tables: the hover card's stat rows */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 5px 8px; text-align: start; border-bottom: 1px solid var(--line-lo); vertical-align: top; }
.tbl th { font: 600 12px/1.3 var(--font-body); color: var(--tx-3); white-space: nowrap; }
.tbl td { color: var(--tx); }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.n { direction: ltr; unicode-bidi: isolate; font: 400 11px/1.6 var(--font-num); color: var(--parch-hi); }
[dir="rtl"] .tbl td.n, [dir="rtl"] .tbl th.n { text-align: left; } /* (numbers line up on the reading end, headers with them) */
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.on td { background: rgba(246, 214, 122, .1); color: var(--gold); }
.tbl tr.on td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
[dir="rtl"] .tbl tr.on td:first-child { box-shadow: inset -2px 0 0 var(--gold); }
.tblwrap { overflow-x: auto; max-width: 100%; border-radius: 8px; background: rgba(255, 255, 255, .03); box-shadow: inset 0 0 0 1px var(--line); }
.tblbox { padding: 6px; }
.setbox { display: grid; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--set-bg); box-shadow: inset 0 0 0 1px var(--set-line); }
.setbox .tbl th { color: #d8c0ff; } .setbox .tbl td, .setbox .tbl th { border-bottom-color: rgba(180, 108, 255, .2); }
.setbox .tblwrap { background: none; box-shadow: none; }

/* bars (mount speeds, set package) */
.bars { display: grid; gap: 6px; }
.bars div { display: grid; grid-template-columns: 74px 1fr 50px; gap: 8px; align-items: center; font-size: 13px; color: var(--tx-2); }
.bars i { position: relative; height: 10px; border-radius: 999px; background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1px var(--line); }
.bars i::after { content: ""; position: absolute; inset: 2px auto 2px 2px; width: calc(var(--v) * (100% - 4px)); border-radius: 999px; background: linear-gradient(90deg, var(--bronze), var(--gold)); box-shadow: 0 0 6px rgba(246, 214, 122, .35); }
[dir="rtl"] .bars i::after { inset: 2px 2px 2px auto; background: linear-gradient(-90deg, var(--bronze), var(--gold)); }
.bars span:last-child { text-align: end; font: 400 10px/1 var(--font-num); color: var(--parch-hi); direction: ltr; }

/* the world map in a slot frame */
.map { position: relative; width: 100%; aspect-ratio: 1; background: #cdbb8e center / 100% 100% no-repeat; image-rendering: pixelated; border-radius: var(--rad-box); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--line-hi), 0 12px 30px rgba(0, 0, 0, .45); overflow: hidden; }
.map .mk { position: absolute; transform: translate(-50%, -50%); width: 12px; height: 12px; padding: 0; border: 2px solid var(--night); border-radius: 3px; background: var(--gold); }
.map .mk:hover { box-shadow: 0 0 0 2px var(--gold), 0 0 10px var(--gold); }
.map .mk.city, .map .mk.home { width: 16px; height: 16px; background: #e04848; }
.map .mk.town { width: 14px; height: 14px; background: #e8a33a; }
.map .mk.village { background: #f2e6c4; }
.map .mk.landmark { background: #b46cff; transform: translate(-50%, -50%) rotate(45deg); }
.map .mk.cave { width: 10px; height: 10px; background: #4a3524; box-shadow: 0 0 0 1px var(--parch-3); border-radius: 50% 50% 0 0; }
.map .mk.waystone { width: 9px; height: 9px; background: var(--teal); }
.map .mk.realm { background: #7af0dc; border-radius: 50%; }
.map .lb { position: absolute; transform: translate(-50%, 9px); padding: 1px 5px; border-radius: 4px; font: 600 11px/1.35 var(--font-body); color: var(--parch-hi); background: rgba(30, 19, 26, .88); box-shadow: 0 0 0 1px var(--edge); white-space: nowrap; pointer-events: none; }
.map .pin { position: absolute; width: 18px; height: 26px; transform: translate(-50%, -100%); background: #e04848; clip-path: polygon(50% 100%, 0 40%, 0 15%, 15% 0, 85% 0, 100% 15%, 100% 40%); box-shadow: 0 0 0 2px var(--night); filter: drop-shadow(0 2px 0 var(--night)); animation: bob 1s steps(2) infinite alternate; }
@keyframes bob { to { margin-top: -3px; } }
.minimap { position: relative; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border-radius: var(--rad-slot); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--line-hi); background-color: #cdbb8e; background-repeat: no-repeat; overflow: hidden; }
.minimap .pin { position: absolute; left: 50%; top: 50%; width: 16px; height: 22px; transform: translate(-50%, -100%); background: #e04848; clip-path: polygon(50% 100%, 0 40%, 0 15%, 15% 0, 85% 0, 100% 15%, 100% 40%); }
.minimap .d { position: absolute; width: 8px; height: 8px; transform: translate(-50%, -50%); border-radius: 2px; background: var(--gold); box-shadow: 0 0 0 2px var(--night); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--tx-2); }
.legend label { display: inline-flex; align-items: center; gap: 6px; }
.legend input { accent-color: var(--bronze-hi); }

/* ---------- the detail: the satchel's hover card, a size up (a dialog) ---------- */
dialog { width: min(900px, calc(100vw - 24px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); padding: 0; color: var(--tx); background: transparent; border: 0; overflow: visible; }
dialog::backdrop { background: rgba(13, 7, 11, .72); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
dialog[open] .dlg { animation: dlgin .16s ease-out; }
@keyframes dlgin { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.dlg { position: relative; display: grid; max-height: inherit; overflow: hidden; border-radius: var(--rad-panel); background: var(--tip); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--bronze), 0 20px 60px rgba(0, 0, 0, .6); }
.dlg .in { overflow-y: auto; padding: 22px 24px 24px; display: grid; gap: 16px; overscroll-behavior: contain; }
.dlg .x { position: absolute; inset-inline-end: 14px; top: 14px; z-index: 2; width: 34px; height: 34px; padding: 0; border: 0; border-radius: var(--rad-btn); display: grid; place-items: center;
  background: rgba(255, 255, 255, .06); color: var(--parch-hi); box-shadow: inset 0 0 0 1px var(--line-mid); font: 500 20px/1 var(--font-body); }
.dlg .x:hover { background: rgba(255, 255, 255, .12); color: var(--gold); }
.dhead { --rc: var(--r-legendary); display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding-inline-end: 44px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.dhead .big { display: grid; place-items: center; width: 160px; height: 160px; border-radius: 14px;
  background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--rc) 24%, transparent), transparent 70%), var(--well); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rc) 70%, #000), inset 0 0 0 3px var(--ring-dk); }
.dhead .big img { width: 144px; height: 144px; image-rendering: pixelated; }
.dhead .big img.ico { width: 96px; height: 96px; }
.dhead h2 { margin: 0; font: 700 26px/1.15 var(--font-title); color: var(--gold); letter-spacing: .02em; text-shadow: 0 2px 0 #000; }
html[lang="he"] .dhead h2 { letter-spacing: 0; }
.dhead .sub2 { margin: 5px 0 0; font-size: 14px; color: var(--tx-2); }
.dhead .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dsec { display: grid; gap: 8px; min-width: 0; }
.dsec h4 { margin: 4px 0 0; display: flex; align-items: center; gap: 10px; font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tx-3); }
html[lang="he"] .dsec h4 { letter-spacing: 0; font-size: 13px; }
.dsec h4::after { content: ""; flex: 1; height: 1px; background: var(--line-lo); }
.dsec p { margin: 0; color: var(--tx); }
.dsec p b { color: var(--gold); }
.quote { margin: 0; padding: 10px 14px; border-radius: 8px; font-style: italic; color: var(--tx-2); background: rgba(255, 255, 255, .04); box-shadow: inset 2px 0 0 var(--bronze-hi); }
[dir="rtl"] .quote { font-style: normal; box-shadow: inset -2px 0 0 var(--bronze-hi); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.cols > * { display: grid; align-content: start; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--tx-2); } .kv dd { margin: 0; font-weight: 600; color: var(--parch-hi); }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: var(--rad-box); background: rgba(0, 0, 0, .3); }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; font: 700 13px/1 var(--font-body); background: transparent; }
.seg button:hover { background: rgba(255, 255, 255, .05); }
.seg button[aria-pressed="true"] { background: linear-gradient(var(--tab-a), var(--tab-b)); box-shadow: inset 0 0 0 1px var(--line-hi); }

const card = (o) => `<a class="card${o.r ? ' r-' + o.r : ''}" href="#${o.cat}/${encodeURIComponent(o.id)}" data-open="${o.cat}|${esc(o.id)}">
  <span class="well${o.lineup ? ' lineup' : ''}">${o.lineup ? o.lineup.map((f) => `<img src="${img(f)}" alt="" loading="lazy" width="96" height="96">`).join('') : o.img ? `<img${o.ico ? ' class="ico"' : ''} src="${img(o.img)}" alt="" loading="lazy" width="96" height="96">` : `<span class="ph">${icon((CATS.find((c) => c[0] === o.cat) || CATS[0])[1])}</span>`}${o.lv ? `<span class="lv">${esc(o.lv)}</span>` : ''}${o.tag ? `<span class="tag ${o.tagc || ''}">${esc(o.tag)}</span>` : ''}</span>
  <span class="txt"><span class="nm">${esc(o.name)}</span>${o.meta ? `<span class="mt">${o.meta}</span>` : ''}${o.extra || ''}</span></a>`;
const sec = (title, body, id) => `<section class="sub"${id ? ` id="${id}"` : ''}><h2 class="sech"><span>${esc(title)}</span></h2>${body}</section>`;
const subh = (title, n) => `<h3>${esc(title)}${n != null ? ` <small>${n}</small>` : ''}</h3>`;

function overview() {
  const pick = (list, f) => (list || []).find(f) || (list || [])[0];
  const pic = {
    monsters: pick(D.monsters, (m) => m.id === 'cyclops')?.img, gear: pick(D.sets?.[2]?.pieces, (p) => p.cat === 'sword1')?.img, skills: pick(D.skills, (s) => s.id === 'thunder')?.img,
    jobs: D.online?.jobs?.find((j) => j.img)?.img, mounts: pick(D.mounts, (m) => m.species === 'dragon')?.img, people: D.characters?.find((c) => c.img)?.img || D.rolePics?.priest, places: null, quests: null,
  };
  const tiles = CATS.slice(1).filter(([c]) => (c !== 'places' || D.places) && (c !== 'jobs' || D.online?.jobs)).map(([c, p]) => `<a class="cat parch" href="#${c}"><span class="pics">${pic[c] ? `<img src="${img(pic[c])}" alt="">` : `<span style="color:var(--gold);width:48px;height:48px">${icon(p)}</span>`}</span>
    <span><h3>${esc(t(c))}${c === 'jobs' ? ` <span class="pill online">${esc(t('online_tag'))}</span>` : ''}</h3><p>${esc(t('d_' + c))}</p></span></a>`).join('');
  const feat = (D.monsters || []).filter((m) => m.img && !m.boss).slice(0, 12);
  return sec(t('overview'), `<div class="cats">${tiles}</div>`) +
    (feat.length ? sec(t('monsters'), `<div class="grid small">${feat.map(monCard).join('')}</div>`) : '') +
    (D.sets ? sec(t('sets'), `<div class="grid wide">${D.sets.slice(0, 6).map(setCard).join('')}</div>`) : '');
}

// ------------------------------------------------------------------------------------------------ monsters
const monCard = (m) => card({ cat: 'monsters', id: m.id, img: m.img, name: tx(m.name), lv: m.levelRange ? `${t('lv')} ${lvr(m.levelRange)}` : '', tag: m.boss ? t('boss') : m.elite ? t('elite') : '', tagc: m.boss ? 'boss' : 'elite',
  meta: esc(tx(CL[m.cls]?.name)) + (m.flying ? ' · ' + esc(t('flies')) : '') + (m.ranged ? ' · ' + esc(tx(m.ranged)) : ''), extra: m.leader ? `<span class="mt">${esc(t('mini_boss'))}: ${esc(t('lv'))} <span class="ltr">${lvr(m.leader.level)}</span></span>` : '' });
// Roy 29.10: the bestiary by level bands (a kind in the band its levels start in; online: its one level), the bosses apart
const BANDS = [[1, 30], [31, 50], [51, 80], [81, 120], [121, 170], [171, 230], [231, 300]];
const bandOf = (lv) => (lv == null ? -1 : Math.max(0, BANDS.findIndex(([a, b]) => lv >= a && lv <= b)));
const bandSecs = (list, lvOf, cardOf) => BANDS.map(([a, b], i) => { const l = list.filter((m) => bandOf(lvOf(m)) === i).sort((x, y) => lvOf(x) - lvOf(y)); return l.length ? `<section class="sub" id="band-${a}">${subh(t('band_n', { a, b }), l.length)}<div class="grid small">${l.map(cardOf).join('')}</div></section>` : ''; }).join('')
  + (() => { const l = list.filter((m) => lvOf(m) == null); return l.length ? `<section class="sub">${subh(t('no_level'), l.length)}<div class="grid small">${l.map(cardOf).join('')}</div></section>` : ''; })();
const isBossM = (m) => !!(m.boss || m.cls === 'boss');
function monsters() {
  const list = D.monsters || [], cnt = {}; for (const m of list) cnt[m.cls] = (cnt[m.cls] || 0) + 1;
  const shown = list.filter((m) => (mFilter === 'all' || m.cls === mFilter) && !isBossM(m));
  if (mMode === 'online' && D.onlineMonsters?.length) return onlineMonsters();
  const chips = `<div class="filters" role="group"><button data-filter="all" aria-pressed="${mFilter === 'all'}">${esc(t('all'))} <b>${list.length}</b></button>${(D.monsterClasses || []).filter((c) => cnt[c.id] && c.id !== 'boss').map((c) => `<button data-filter="${c.id}" aria-pressed="${mFilter === c.id}">${esc(tx(c.name))} <b>${cnt[c.id]}</b></button>`).join('')}</div>`;
  return sec(t('monsters'), `<p class="lead">${esc(t('d_monsters'))}</p>${monSeg()}${chips}`) + bandSecs(shown, (m) => m.levelRange?.[0] ?? null, monCard) + bossSecs();
}
// the Bosses: the campaign's named bosses (data.monsters, boss) and, online, the boss caves and the job quests' bosses (data.online.bosses)
const bossCard = (b) => { const M = MON()[b.body], O = (D.onlineMonsters || []).find((m) => m.body === b.body); return card({ cat: 'monsters', id: 'b:' + b.id, img: M?.img || O?.img, name: tx(b.name), lv: `${t('lv')} ${b.level}`, tag: t('boss'), tagc: 'boss', r: 'legendary',
  meta: (b.kind === 'cave' ? `${esc(tx(b.nearName) || b.near)} · ${esc(t('party_n'))} ${b.party}` : esc(tx(b.questTitle))) + ` · <span class="pill online">${esc(t('online_tag'))}</span>` }); };
function bossSecs() {
  const camp = (D.monsters || []).filter(isBossM), ob = D.online?.bosses || [], cave = ob.filter((b) => b.kind === 'cave'), job = ob.filter((b) => b.kind === 'job');
  if (!camp.length && !ob.length) return '';
  return sec(t('bosses'), `<p class="lead">${esc(t('d_bosses'))}</p>`, 'bosses') +
    (camp.length ? `<section class="sub">${subh(t('boss_story'), camp.length)}<div class="grid small">${camp.map(monCard).join('')}</div></section>` : '') +
    (cave.length ? `<section class="sub">${subh(t('boss_cave'), cave.length)}<div class="grid small">${cave.map(bossCard).join('')}</div></section>` : '') +
    (job.length ? `<section class="sub">${subh(t('boss_job'), job.length)}<div class="grid small">${job.map(bossCard).join('')}</div></section>` : '');
}
function bossDetail(b) {
  const M = MON()[b.body], O = (D.onlineMonsters || []).find((m) => m.body === b.body), pic = M?.img || O?.img;
  return `<div class="dhead"><span class="big">${pic ? `<img src="${img(pic)}" alt="">` : ''}</span><div><h2 id="dlgt">${esc(tx(b.name))}</h2><p class="sub2">${esc(tx(b.title))}</p>
    <div class="tags"><span class="pill online">${esc(t('online_badge'))}</span><span class="pill gold">${esc(t('boss'))}</span></div></div></div>
    <div class="cols"><div class="dsec"><h4>${esc(t('level'))}</h4><p><span class="ltr">${b.level}</span>${b.atHer ? ` · ${esc(t('at_her'))}` : ''}</p>${b.party ? `<h4>${esc(t('party_n'))}</h4><p class="ltr">${b.party}</p>` : ''}</div>
    <div class="dsec">${b.kind === 'cave' ? `<h4>${esc(t('where'))}</h4><p>${esc(tx(b.nearName) || b.near)}</p>` : `<h4>${esc(t('quest_n'))}</h4><p><a href="#quests/q:${b.quest}" data-open="quests|q:${b.quest}">${esc(tx(b.questTitle))}</a></p>`}
      ${M ? `<h4>${esc(t('body'))}</h4><div class="grid small">${monCard(M)}</div>` : ''}</div></div>`;
}
const miniBoss = (L0) => (L0 ? `<div class="dsec"><h4>${esc(t('mini_boss'))}</h4><p><b>${esc(t('lv'))} <span class="ltr">${Array.isArray(L0.level) ? lvr(L0.level) : L0.level}</span></b> (+${L0.plus})</p><p class="hint">${esc(t('mini_note', { c: Math.round((L0.chance || 0) * 100), p: L0.plus }))}</p></div>` : '');
// BETA ONLINE bestiary (data.onlineMonsters: each species at its one level in its home region, its hit points x1.5): its own tab
const monSeg = () => (D.onlineMonsters?.length ? `<div><span class="seg" role="group"><button type="button" data-mmode="campaign" aria-pressed="${mMode === 'campaign'}">${esc(t('campaign'))} <b>${(D.monsters || []).length}</b></button><button type="button" data-mmode="online" aria-pressed="${mMode === 'online'}">${esc(t('online_mons'))} <b>${D.onlineMonsters.length}</b> <span class="pill online">${esc(t('online_tag'))}</span></button></span></div>` : '');
const omonCard = (m) => card({ cat: 'monsters', id: 'o:' + m.id, img: m.img, name: tx(m.name), lv: `${t('lv')} ${m.level}`, tag: m.elite ? t('elite') : t('online_tag'), tagc: m.elite ? 'elite' : 'online', r: m.elite ? 'legendary' : '',
  meta: esc(tx(m.region?.name)) + (m.night ? ' · ' + esc(t('only_night')) : '') + (m.cave ? ' · ' + esc(t('cave')) : ''), extra: m.leader ? `<span class="mt">${esc(t('mini_boss'))}: ${esc(t('lv'))} <span class="ltr">${m.leader.level}</span></span>` : '' });
function onlineMonsters() {
  const mul = D.onlineMonsters.find((m) => m.hpMul)?.hpMul || 1.5, regs = (D.onlineRegions || []).slice().sort((a, b) => a.level[0] - b.level[0] || a.level[1] - b.level[1]), OM = by(D.onlineMonsters);
  void regs; void OM; const body = bandSecs(D.onlineMonsters, (m) => m.level, omonCard); // (Roy 29.10: by level bands; each card names its home region)
  return sec(t('monsters'), `<p class="lead">${esc(t('d_monsters'))}</p>${monSeg()}<p class="oband"><span class="pill online">${esc(t('online_badge'))}</span> ${esc(t('online_mons_lead', { m: mul }))}</p>`) + body + bossSecs();
}
function omonDetail(m) {
  const S = m.stats || {}, base = MON()[m.body], mul = m.hpMul || 1;
  return `<div class="dhead"><span class="big">${m.img ? `<img src="${img(m.img)}" alt="">` : ''}</span><div><h2 id="dlgt">${esc(tx(m.name))}</h2>
    <p class="sub2">${esc(t('level'))} <span class="ltr">${m.level}</span> · ${esc(tx(m.region?.name))}</p>
    <div class="tags"><span class="pill online">${esc(t('online_badge'))}</span>${m.elite ? `<span class="pill gold">${esc(t('elite'))}</span>` : ''}${m.night ? `<span class="pill">${esc(t('only_night'))}</span>` : ''}${m.cave ? `<span class="pill">${esc(t('cave_dweller'))}</span>` : ''}</div></div></div>
    ${m.info ? `<div class="dsec"><h4>${esc(t('about'))}</h4><p>${esc(tx(m.info))}</p></div>` : ''}
    <div class="cols"><div class="dsec"><h4>${esc(t('level'))} ${m.level}</h4><dl class="kv"><dt>${esc(t('hp'))}</dt><dd class="ltr">${S.hp != null ? num(S.hp) : '–'}</dd><dt>${esc(t('blow'))}</dt><dd class="ltr">${S.dmg != null ? num(S.dmg) : '–'}</dd><dt>${esc(t('exp'))}</dt><dd class="ltr">${S.exp != null ? num(S.exp) : '–'}</dd>
      ${S.speed != null ? `<dt>${esc(t('speed'))}</dt><dd class="ltr">${S.speed}</dd>` : ''}${S.range != null ? `<dt>${esc(t('range'))}</dt><dd class="ltr">${S.range} m</dd>` : ''}${S.aggro != null ? `<dt>${esc(t('aggro'))}</dt><dd class="ltr">${S.aggro} m</dd>` : ''}
      <dt>${esc(t('size'))}</dt><dd class="ltr">×${m.size?.scale ?? 1} · ${m.size?.height ?? '–'} m</dd></dl>
      ${S.hp != null && mul !== 1 ? `<p class="hint">${esc(t('hp_note', { m: mul, b: num(S.hpBase) }))} ${esc(t('big_hint'))}</p>` : ''}
      ${m.speedBonus || m.dmgBonus ? `<p>${esc(t('hum_bonus', { s: m.speedBonus, d: m.dmgBonus }))}</p>` : ''}${miniBoss(m.leader)}</div>
    <div class="dsec"><h4>${esc(t('home_region'))}</h4><p>${esc(tx(m.region?.name))} · ${esc(t('lv'))} <span class="ltr">${lvr(m.region?.level)}</span></p>
      ${m.skills?.length ? `<h4>${esc(t('moves'))}</h4><div class="tags">${m.skills.map((s) => `<span class="pill">${esc(tx(s.name) || s.id)}</span>`).join('')}</div>` : ''}
      ${base ? `<h4>${esc(t('body'))}</h4><div class="grid small">${monCard(base)}</div>` : m.bodyName ? `<h4>${esc(t('body'))}</h4><p>${esc(tx(m.bodyName))}</p>` : ''}</div></div>`;
}
function monDetail(m) {
  const inR = (lv) => m.levelRange && lv >= m.levelRange[0] - 2 && lv <= m.levelRange[1] + 2;
  const rows = (m.levels || []).map(([lv, hp, dmg, ex]) => `<tr${inR(lv) ? ' class="on"' : ''}><td class="n">${lv}</td><td class="n" title="${hp}">${num(hp)}</td><td class="n">${num(dmg)}</td><td class="n">${num(ex)}</td></tr>`).join('');
  const wh = [];
  if (m.realm) wh.push(`<p><span class="pill teal">${esc(t('realm_where'))}</span> ${esc(tx(m.realm))}</p>`);
  if (m.regions?.length) wh.push(`<div class="tblwrap"><table class="tbl"><tr><th>${esc(t('region'))}</th><th class="n">${esc(t('lvl_range'))}</th><th class="n">${esc(t('share'))}</th><th class="n">${esc(t('pack'))}</th></tr>${m.regions.map((r) => { const R = RG[r.r]; return `<tr><td>${esc(tx(R?.name) || r.r)}</td><td class="n">${R?.level ? lvr(R.level) : ''}</td><td class="n">${pct(r.share, 0)}</td><td class="n">${r.pack ? lvr(r.pack) : ''}</td></tr>`; }).join('')}</table></div>`);
  if (m.biomes?.length) wh.push(`<div class="tblwrap"><table class="tbl"><tr><th>${esc(t('biome'))}</th><th class="n">${esc(t('day'))}</th><th class="n">${esc(t('night'))}</th></tr>${m.biomes.map((b) => `<tr><td>${esc(tx(BI[b.b]?.name) || b.b)}${!b.day ? ` <span class="pill">${esc(t('only_night'))}</span>` : ''}</td><td class="n">${b.day ? pct(b.day, 0) : '–'}</td><td class="n">${b.night ? pct(b.night, 0) : '–'}</td></tr>`).join('')}</table></div>`);
  if (m.eliteIn?.length) wh.push(`<p><span class="pill gold">${esc(t('elite'))}</span> ${esc(t('elite_in'))}: ${m.eliteIn.map((e) => esc(e.region ? tx(RG[e.region]?.name) || e.region : tx(BI[e.biome]?.name) || e.biome)).join(' · ')}</p>`);
  if (!wh.length) wh.push(`<p>${esc(t('no_where'))}</p>`);
  const dn = (d) => d.kind === 'equip' ? (() => { const [, k, r] = d.id.split(':'); return `${esc(t(k === 'weapon' ? 'weapon_n' : k === 'shield' ? 'shield_n' : 'armor_n'))} <span class="rar ${r}">(${esc(t(r))})</span>`; })() : esc(tx(d.name) || d.id);
  const drops = (m.drops || []).filter((d) => d.chance >= .0005);
  const db = m.db ? Object.entries(m.db).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(typeof v === 'object' && v ? tx(v) : String(v))}</dd>`).join('') : '';
  return `<div class="dhead"><span class="big">${m.img ? `<img src="${img(m.img)}" alt="">` : ''}</span><div><h2 id="dlgt">${esc(tx(m.name))}</h2>${m.title ? `<p class="sub2">${esc(tx(m.title))}</p>` : ''}
    <p class="sub2">${esc(tx(CL[m.cls]?.name))}${m.levelRange ? ` · ${esc(t('lv'))} <span class="ltr">${lvr(m.levelRange)}</span>` : ''}</p>
    <div class="tags">${m.boss ? `<span class="pill red">${esc(t('boss'))}</span>` : ''}${m.elite ? `<span class="pill gold">${esc(t('elite'))}</span>` : ''}${(m.traits || []).map((x) => `<span class="pill">${esc(tx(x))}</span>`).join('')}</div></div></div>
    ${m.info ? `<div class="dsec"><h4>${esc(t('about'))}</h4><p>${esc(tx(m.info))}</p></div>` : ''}
    <div class="cols"><div class="dsec"><h4>${esc(t('stats_lvl'))}</h4><div class="tblwrap"><table class="tbl"><tr><th class="n">${esc(t('lv'))}</th><th class="n">${esc(t('hp'))}</th><th class="n">${esc(t('blow'))}</th><th class="n">${esc(t('exp'))}</th></tr>${rows}</table></div>
      <p class="hint">${esc(m.levelRange ? t('in_range') + ' ' : '')}${esc(t('big_hint'))}</p>
      <dl class="kv"><dt>${esc(t('speed'))}</dt><dd class="ltr">${m.base?.speed ?? '–'}</dd><dt>${esc(t('range'))}</dt><dd class="ltr">${m.base?.range ?? '–'} m</dd><dt>${esc(t('aggro'))}</dt><dd class="ltr">${m.base?.aggro ?? '–'} m</dd>${m.ranged ? `<dt>${esc(t('range'))}</dt><dd>${esc(tx(m.ranged))}</dd>` : ''}</dl></div>
    <div class="dsec"><h4>${esc(t('where'))}</h4>${wh.join('')}${m.levelFrom === 'biomes' ? `<p class="hint">${esc(t('lv'))} <span class="ltr">${lvr(m.levelRange)}</span>: ${esc(t('lands_lv'))}</p>` : ''}${miniBoss(m.leader)}
      ${drops.length ? `<h4>${esc(t('drops'))}</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th class="n">${esc(t('chance'))}</th><th class="n">${esc(t('qty'))}</th></tr>${drops.map((d) => `<tr><td>${dn(d)}</td><td class="n">${pct(d.chance, d.chance < .01 ? 2 : 1)}</td><td class="n">${d.qty ? '~' + d.qty : ''}</td></tr>`).join('')}</table></div>${drops[0]?.atLevel ? `<p class="hint">${esc(t('at_level', { n: drops[0].atLevel }))}</p>` : ''}` : ''}</div></div>
    ${db ? `<div class="dsec"><h4>${esc(t('more'))}</h4><dl class="kv">${db}</dl></div>` : ''}`;
}

// ------------------------------------------------------------------------------------------------ gear
const catName = (c) => tx(WT[c]?.name) || tx(JOB_I().kinds[c]?.name) || c;
const setCard = (s) => card({ cat: 'gear', id: 'set:' + s.id, img: (s.pieces.find((p) => p.cat === 'sword1') || s.pieces.find((p) => p.cat === 'body') || s.pieces[0])?.img, ico: true, name: tx(s.name), lv: `${t('lv')} ${s.lvl}`,

  return sec(t('gear'), `<p class="lead">${esc(t('d_gear'))}</p>`) +
    (D.sets ? `<section class="sub">${subh(t('sets'), D.sets.length)}<div class="grid wide">${D.sets.map(setCard).join('')}</div></section>` : '') +
    (D.standalone ? `<section class="sub">${subh(t('standalone'), D.standalone.length)}<div class="grid">${D.standalone.map(itemCard).join('')}</div></section>` : '') +

    ${q.teaches?.length ? `<h4>${esc(t('teaches'))}</h4><p>${q.teaches.filter((id) => JOB_I().skills[id]).map((id) => `<a href="#jobs/sk:${id}" data-open="jobs|sk:${id}">${esc(tx(JOB_I().skills[id].name))}</a>${q.kind === 'herald' ? ' (' + esc(jobName(JOB_I().skills[id].job)) + ')' : ''}`).join(', ')}</p>` : ''}
    ${q.questItems?.length ? `<h4>${esc(t('quest_items'))}</h4><ul style="margin:0;padding-inline-start:20px">${q.questItems.map((i) => `<li>${esc(tx(i.name) || i.id)} ×${i.n}${i.desc ? `<div class="mt">${esc(tx(i.desc))}</div>` : ''}</li>`).join('')}</ul><p class="mt">${esc(t('qi_note'))}</p>` : ''}
    <h4>${esc(t('giver'))}</h4>${giver ? personRow(giver) : `<p>${esc(q.giver ? personName(q.giver.role) + ' · ' + placeOf(q.giver.place) : '')}</p>`}</div></div>`;
}
function npcDetail(p) {
  const { O } = JOB_I(), qs = (O.quests || []).filter((q) => q.giver?.role === p.key), spots = p.spots || (p.x != null ? [{ hall: p.hall, x: p.x, z: p.z }] : []);
  return `<div class="dhead"><span class="big">${p.img ? `<img src="${img(p.img)}" alt="">` : ''}</span><div><h2 id="dlgt" style="color:${esc(p.color || 'inherit')};text-shadow:1px 1px 0 var(--night)">${esc(tx(p.name))}</h2><p class="sub2">${esc(tx(JOB_I().roles[p.role]?.name) || p.role)}${p.job ? ' · ' + esc(jobName(p.job)) : ''}${p.path ? ' · ' + esc(pathName(p.path)) : ''}</p><div class="tags">${opill()}${p.title ? `<span class="pill">${esc(tx(p.title))}</span>` : ''}</div></div></div>
    ${p.intro ? `<blockquote class="quote">“${esc(tx(p.intro))}”</blockquote>` : ''}
    <div class="cols"><div class="dsec"><h4>${esc(t('where_stand'))}</h4>${spots.map((q) => `<p><b>${esc(placeOf(q.place || q.hall))}</b> <span class="ltr">${q.x}, ${q.z}</span>${q.when ? ` · ${esc(tx(q.when))}` : ''}</p>`).join('')}${spots[0] ? miniMap(spots[0].x, spots[0].z, [], 420) : ''}</div>
    <div class="dsec">${p.shopTitle ? `<h4>${esc(t('shop'))}</h4><p>${esc(tx(p.shopTitle))}</p>` : ''}${qs.length ? `<h4>${esc(t('gives_quests'))}</h4><div class="rows">${qs.map(jqRow).join('')}</div>` : ''}${p.job ? `<p><a href="#jobs/job:${p.job}" data-open="jobs|job:${p.job}">${esc(jobName(p.job))}</a></p>` : ''}</div></div>`;
}
function hallDetail(h) {
  const { O } = JOB_I(), ppl = (O.people || []).filter((p) => p.hall === h.id);
  return `<div class="dhead"><span class="big">${ppl[0]?.img ? `<img src="${img(ppl[0].img)}" alt="">` : ''}</span><div><h2 id="dlgt">${esc(tx(h.name))}</h2><p class="sub2">${esc(tx(h.sub))} · ${esc(jobName(h.job))}</p><div class="tags">${opill()}${h.anchor != null ? `<span class="pill">${esc(t('anchor'))} ${h.anchor}</span>` : ''}<span class="pill ltr">${h.x}, ${h.z}</span></div></div></div>
    ${h.hidden ? `<div class="dsec"><p>${esc(t('hidden_hall'))}</p></div>` : ''}
    <div class="cols"><div class="dsec"><h4>${esc(t('coords'))}</h4>${miniMap(h.x, h.z, ppl.map((p) => ({ x: p.x, z: p.z, title: tx(p.name) })), 420)}${h.near ? `<p>${esc(t('near'))} ${esc(tx(h.near.name))} (${h.near.d} m)</p>` : ''}</div>
    <div class="dsec"><h4>${esc(t('people_n'))}</h4><div class="rows">${ppl.map(personRow).join('')}</div></div></div>`;
}
function jobFind(id) {
  const I = JOB_I(), [k, ...r] = id.split(':'), v = r.join(':');
  if (k === 'job') return I.jobs[v] && jobDetail(I.jobs[v]);
  if (k === 'sk') return I.skills[v] && jskDetail(I.skills[v]);
  if (k === 'q') return I.quests[v] && jqDetail(I.quests[v]);
  if (k === 'npc') return I.people[v] && npcDetail(I.people[v]);
  if (k === 'hall') return I.halls[v] && hallDetail(I.halls[v]);
  if (k === 'w') { const p = I.weapons[v]; return p && itemDetail(p).replace('<div class="tags">', `<div class="tags">${opill()}<span class="pill">${esc(jobName(p.job))}</span>${p.starter ? `<span class="pill gold">${esc(t('starter'))}</span>` : ''}${p.reward ? `<span class="pill gold">${esc(t('oath_reward'))}</span>` : ''}${p.stub ? `<span class="pill">${esc(t('stub'))}</span>` : ''}`); }
  if (k === 'set') { const s = I.sets[v]; return s && setDetail(s).replace('</p>', ` · ${esc(jobName(s.job))}${s.path ? ' · ' + esc(pathName(s.path)) : ''}</p><div class="tags">${opill()}</div>`); }
  return null;
}

// ------------------------------------------------------------------------------------------------ the detail dialog
function find(cat, id) {
  if (cat === 'monsters') { if (id.startsWith('b:')) { const b = (D.online?.bosses || []).find((x) => x.id === id.slice(2)); return b && bossDetail(b); } if (id.startsWith('o:')) { const m = (D.onlineMonsters || []).find((x) => x.id === id.slice(2)); return m && omonDetail(m); } const m = MON()[id]; return m && monDetail(m); }
  if (cat === 'skills') { const s = (D.skills || []).find((x) => x.id === id); return s && skDetail(s); }
  if (cat === 'mounts') { const s = (D.mounts || []).find((x) => x.id === id); return s && mtDetail(s); }
  if (cat === 'quests') { if (id.startsWith('q:')) return jobFind(id); const s = (D.quests || []).find((x) => x.id === id); return s && questDetail(s); } // (q:id: a job quest, Roy 29.10)
  if (cat === 'jobs') return jobFind(id);
  const [k, ...r] = id.split(':'), v = r.join(':');
  if (cat === 'gear') {
    if (k === 'set') { const s = (D.sets || []).find((x) => x.id === v); return s && setDetail(s); }
    if (k === 'item') { const p = (D.standalone || []).find((x) => x.id === v) || (D.sets || []).flatMap((s) => s.pieces).find((x) => x.id === v); return p && itemDetail(p); }
    if (k === 'heir') { const p = (D.heirlooms || []).find((x) => x.id === v); return p && itemDetail(p, true); }
  }
  if (cat === 'people') { if (k === 'town') return TOWN[v] && townDetail(TOWN[v]); if (k === 'char') { const c = (D.characters || []).find((x) => x.key === v); return c && charDetail(c); } }
  if (cat === 'places') { if (k === 'place') return PL[v] && placeDetail(PL[v]); if (k === 'reg') return RG[v] && regDetail(RG[v]); if (k === 'dun') { const d = (D.dungeons || []).find((x) => x.id === v); return d && dunDetail(d); } }
  return null;
}
let lastFocus = null;
function openItem(cat, id) {
  const html = D && find(cat, id); if (!html) return;
  const dlg = $('#dlg'), box = $('#dlgin');
  box.innerHTML = html; box.scrollTop = 0; bindCards(box);
  $$('[data-rar]', box).forEach((b) => b.addEventListener('click', () => { gRar = b.dataset.rar; openItem(cat, id); }));
  if (!dlg.open) { lastFocus = document.activeElement; dlg.showModal(); }
}
function closeDlg(fromHash) {
  const dlg = $('#dlg'); if (!dlg.open) return;
  dlg.close();
  if (!fromHash && route.id) { route.id = null; history.replaceState(null, '', location.pathname + location.search + (route.cat === 'search' ? '#s=' + encodeURIComponent(route.q) : '#' + route.cat)); }
  lastFocus?.focus?.({ preventScroll: true });
}
$('#dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg' || e.target.closest('[data-a=close]')) closeDlg(); });
$('#dlg').addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(); });

// ------------------------------------------------------------------------------------------------ search: every name and line, both languages
const norm = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[֑-ׇ̀-ͯ]/g, '').replace(/[’'״"׳]/g, '');
function index() {
  const out = [], add = (cat, id, name, text, card2) => out.push({ cat, id, name, k: norm([name?.he, name?.en, ...(text || []).flatMap((x) => (x && typeof x === 'object' ? [x.he, x.en] : [x]))].join(' ')), card: card2 });
  for (const m of D.monsters || []) add('monsters', m.id, m.name, [m.id, CL[m.cls]?.name, m.info, ...(m.traits || [])], () => monCard(m));
  for (const s of D.sets || []) { add('gear', 'set:' + s.id, s.name, [s.theme, FAM[s.family]?.name, s.passive?.name], () => setCard(s)); for (const p of s.pieces) add('gear', 'item:' + p.id, p.name, [WT[p.cat]?.name], () => itemCard(p)); }
  for (const p of D.standalone || []) add('gear', 'item:' + p.id, p.name, [p.desc, WT[p.cat]?.name, FAM[p.family]?.name], () => itemCard(p));
  for (const s of D.skills || []) add('skills', s.id, s.name, [s.desc, s.source], () => skCard(s));
  for (const m of D.mounts || []) add('mounts', m.id, m.name, [m.desc, SPN(m.species)], () => mtCard(m));
  for (const s of D.towns || []) { add('people', 'town:' + s.id, s.name, [s.sub, ...s.people.flatMap((p) => [p.name, ROLE[p.role]?.name])], () => townCard(s)); }
  for (const c of D.characters || []) add('people', 'char:' + c.key, c.name, [c.quote], () => charCard(c));
  for (const p of D.places || []) if (!TOWN[p.id]) add('places', 'place:' + p.id, p.name, [p.sub], () => card({ cat: 'places', id: 'place:' + p.id, name: tx(p.name), meta: esc(kindName(p.kind)), lv: p.level ? `${t('lv')} ${p.level}` : '' }));
  for (const d of D.dungeons || []) add('places', 'dun:' + d.id, d.name, [d.sub, d.near && PL[d.near.id]?.name], () => card({ cat: 'places', id: 'dun:' + d.id, name: tx(d.name), meta: esc(t(d.kind)) + (d.near ? ' · ' + esc(tx(PL[d.near.id]?.name)) : ''), lv: d.level ? `${t('lv')} ${d.level}` : '' }));
  for (const q of D.quests || []) add('quests', q.id, q.title, [q.offer, ...(q.steps || [])], () => card({ cat: 'quests', id: q.id, name: tx(q.title), meta: giverOf(q), lv: q.lvl ? `${t('lv')} ${q.lvl}` : '' }));
  // BETA ONLINE: the online bestiary and the jobs
  for (const m of D.onlineMonsters || []) add('monsters', 'o:' + m.id, m.name, [m.id, m.region?.name, m.info, 'online'], () => omonCard(m));
  const O = D.online || {};
  for (const j of O.jobs || []) add('jobs', 'job:' + j.id, j.name?.m, [j.name?.f, ...j.tiers.flatMap((x) => [x.name?.m, x.name?.f]), 'online'], () => jobCard(j));
  for (const s of O.skills || []) add('jobs', 'sk:' + s.id, s.name, [s.desc, s.specName, 'online'], () => jskCard(s));
  for (const p of O.people || []) add('jobs', 'npc:' + p.key, p.name, [p.title, p.shopTitle, 'online'], () => card({ cat: 'jobs', id: 'npc:' + p.key, img: p.img, name: tx(p.name), tag: t('online_tag'), tagc: 'online', meta: esc(tx(JOB_I().roles[p.role]?.name) || '') }));
  for (const h of O.halls || []) add('jobs', 'hall:' + h.id, h.name, [h.sub, 'online'], () => card({ cat: 'jobs', id: 'hall:' + h.id, name: tx(h.name), tag: t('online_tag'), tagc: 'online', meta: esc(tx(h.sub)) }));
  for (const q of O.quests || []) add('jobs', 'q:' + q.id, q.title, [q.offer, ...(q.steps || []), 'online'], () => card({ cat: 'jobs', id: 'q:' + q.id, name: tx(q.title), tag: t('online_tag'), tagc: 'online', meta: esc(qkName(q)), lv: q.lvl ? `${t('lv')} ${q.lvl}` : '' }));
  for (const p of O.weapons || []) add('jobs', 'w:' + p.id, p.name, [p.desc, p.special, 'online'], () => jwCard(p));
  for (const s of O.sets || []) { add('jobs', 'set:' + s.id, s.name, [s.theme, 'online'], () => jsetCard(s)); }
  return out;
}
function searchView(q) {
  IDX ||= index();
  const words = norm(q).split(/\s+/).filter(Boolean); if (!words.length) return overview();
  const hits = IDX.map((e) => { const n = norm(tx(e.name)); let s = 0; for (const w of words) { if (!e.k.includes(w)) return null; s += n.startsWith(w) ? 3 : n.includes(w) ? 2 : 1; } return { e, s }; }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 120);
  if (!hits.length) return sec(t('results', { q }), `<p class="empty">${esc(t('none'))}</p>`);
  const groups = {}; for (const h of hits) (groups[h.e.cat] ||= []).push(h.e);
  return sec(t('results', { q }), Object.entries(groups).map(([c, l]) => `<section class="sub res">${subh(t(c), l.length)}<div class="grid">${l.map((e) => e.card()).join('')}</div></section>`).join(''));
}
let sT = 0;
$('#q').addEventListener('input', (e) => {
  const v = e.target.value; $('#sbox').classList.toggle('has', !!v);
  clearTimeout(sT); sT = setTimeout(() => {
    if (v.trim()) { route = { cat: 'search', q: v }; history.replaceState(null, '', '#s=' + encodeURIComponent(v)); }
    else { route = { cat: 'overview' }; history.replaceState(null, '', location.pathname + location.search); }
    render();
  }, 140);
});
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#view').scrollIntoView({ block: 'start' }); } if (e.key === 'Escape') { e.target.value = ''; e.target.dispatchEvent(new Event('input')); } });
$('#qx').addEventListener('click', () => { const i = $('#q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName) && !$('#dlg').open) { e.preventDefault(); $('#q').focus(); } });
SoLang.mount((l) => { L = l; chrome(); IDX = null; if (D) { render(); if (route.id) openItem(route.cat, route.id); } });
boot();
</script>
