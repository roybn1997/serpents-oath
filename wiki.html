<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki · The Serpent's Oath</title>
<meta name="description" content="The Serpent's Oath wiki: every monster, weapon, armour set, skill, mount, town, person and dungeon of the game, in English and Hebrew.">
<meta name="theme-color" content="#160e08">
<meta property="og:title" content="The Serpent's Oath · Wiki">
<meta property="og:description" content="Every monster, weapon, set, skill, mount, person and place in the game.">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="lang.css">
<style>
/* The wiki, in the same language as the home page (index.html): night sky, bronze frames, parchment, pixel sprites.
   Its data and pictures come from the game itself (tools/site/wiki-gen.mjs in the game repo writes wiki/data.json and wiki/img/). */
:root {
  --parch: #e7ddc4; --parch-hi: #f2e9d3; --parch-2: #d9cba6; --parch-3: #bea877;
  --ink: #2b1a0e; --ink-2: #4a3220; --night: #160e08; --leather: #2b1d13; --leather-2: #3b291b; --leather-3: #4a3524;
  --bronze: #a8742c; --bronze-hi: #d9a441; --bronze-dk: #6a4518; --gold: #f2cf72; --teal: #34d1bf; --teal-dk: #1d8c80;
  --r-normal: #c8c2b0; --r-epic: #b46cff; --r-legendary: #ffb22e; --hp: #bd2b2b; --mp: #2f6dff;
  --fr-lg: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 4px var(--bronze), inset 0 0 0 6px var(--night), inset 0 0 0 10px rgba(140, 100, 50, .15), 0 4px 0 0 rgba(10, 6, 3, .5);
  --fr-sm: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 3px var(--bronze-dk), 0 3px 0 0 rgba(10, 6, 3, .5);
  --tex: url(assets/tex-parch.png);
  --font-title: "Rubik", "Pixelify Sans", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, sans-serif;
  --font-num: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  --cur-arrow: url(assets/cur-arrow.png) 1 1, default;
  --cur-hand: url(assets/cur-hand.png) 1 1, pointer;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
html:not([lang="he"]) { --font-title: "Pixelify Sans", "Rubik", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; -webkit-text-size-adjust: 100%; }
html, body { cursor: var(--cur-arrow); }
body { margin: 0; min-height: 100vh; overflow-x: hidden; background: var(--night); color: var(--parch-hi); font: 400 16px/1.55 var(--font-body); }
a, button, summary, label, .card, [role="button"] { cursor: var(--cur-hand); }
a { color: var(--gold); }
img { max-width: 100%; display: block; }
.px { image-rendering: pixelated; }
.ltr { direction: ltr; unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }

.sky { position: fixed; inset: 0; z-index: -2; background: radial-gradient(ellipse at 50% 120%, #3b291b 0%, #160e08 60%); }
.sky::before, .sky::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#f2cf72 1.5px, transparent 1.6px), radial-gradient(#e7ddc4 1px, transparent 1.2px); background-size: 90px 70px, 57px 43px; background-position: 0 0, 20px 30px; opacity: .45; animation: tw 3.2s steps(2) infinite; }
.sky::after { background-size: 131px 97px, 77px 61px; background-position: 40px 12px, 9px 50px; opacity: .3; animation-delay: -1.6s; }
@keyframes tw { 50% { opacity: .15; } }

/* ---------- top bar (as on the home page) ---------- */
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px var(--gut);
  background: rgba(22, 14, 8, .94); box-shadow: inset 0 -2px 0 var(--bronze-dk), 0 2px 0 rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--gold); text-decoration: none; font: 600 20px/1 "Pixelify Sans", sans-serif; white-space: nowrap; direction: ltr; text-shadow: 2px 2px 0 #000; }
.brand img { width: 32px; height: 32px; image-rendering: pixelated; }
.bar nav { display: flex; gap: 4px; margin-inline-start: auto; align-items: center; }
.bar nav a { padding: 6px 10px; color: var(--parch-2); text-decoration: none; font-weight: 500; font-size: 16px; }
.bar nav a:hover { color: var(--gold); }
.bar nav a.wikilink { color: var(--gold); box-shadow: inset 0 -3px 0 var(--bronze-hi); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font: 600 16px/1.2 var(--font-body); color: var(--parch-hi); background: var(--leather); border: 2px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze); text-decoration: none; }
.chip:hover { background: var(--leather-2); color: var(--gold); }

/* ---------- wiki head: title, band and the search tablet ---------- */
.whead { position: relative; display: grid; justify-items: center; gap: 12px; padding: 34px var(--gut) 26px; text-align: center; }
.whead h1 { margin: 0; font: 700 clamp(40px, 7vw, 72px)/1.1 var(--font-title); color: var(--gold);
  text-shadow: 3px 0 0 #1a110b, -3px 0 0 #1a110b, 0 3px 0 #1a110b, 0 -3px 0 #1a110b, 3px 3px 0 #1a110b, -3px 3px 0 #1a110b, 3px -3px 0 #1a110b, -3px -3px 0 #1a110b, 0 7px 0 #6a4518, 0 10px 0 #1a110b; }
.band { width: min(520px, 84vw); height: 30px; image-rendering: pixelated;
  background: url(assets/emblem.png) center / 54px 22px no-repeat, linear-gradient(var(--night), var(--night)) center / 84px 30px no-repeat, url(assets/mz-gold.png) 0 50% / 20px 26px repeat-x; }
.whead p { margin: 0; max-width: 64ch; color: var(--parch-2); text-wrap: balance; }
.search { position: relative; width: min(640px, 100%); margin-top: 6px; }
.search input { width: 100%; min-height: 52px; padding: 12px 52px 12px 18px; padding-inline: 18px 52px; font: 500 18px/1.2 var(--font-body); color: var(--ink);
  background: var(--parch-hi) var(--tex) 0 0 / 128px; image-rendering: pixelated; border: 3px solid var(--night); border-radius: 0; box-shadow: inset 0 0 0 2px var(--bronze-hi), 0 4px 0 0 var(--night); -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: #7a6448; }
.search input::-webkit-search-cancel-button { display: none; }
.search .mag { position: absolute; inset-inline-end: 16px; top: 50%; width: 22px; height: 22px; margin-top: -11px; pointer-events: none; color: var(--bronze-dk); }
.search .clear { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); display: none; width: 34px; height: 34px; border: 0; background: var(--leather); color: var(--parch-hi); box-shadow: inset 0 0 0 2px var(--bronze); font-size: 18px; line-height: 1; }
.search.has .clear { display: block; } .search.has .mag { display: none; }
.hint { font-size: 14px; color: var(--parch-3); }
.hint kbd { font: 400 12px/1 var(--font-num); padding: 2px 5px; background: var(--leather); box-shadow: inset 0 0 0 1px var(--bronze); color: var(--gold); }

/* ---------- the category rail (sticky under the bar) ---------- */
.rail { position: sticky; top: 56px; z-index: 25; display: flex; gap: 6px; padding: 8px var(--gut); overflow-x: auto; scrollbar-width: none; background: rgba(22, 14, 8, .92); box-shadow: inset 0 -2px 0 rgba(106, 69, 24, .6); justify-content: safe center; }
.rail::-webkit-scrollbar { display: none; }
.rail a { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; text-decoration: none; color: var(--parch-2); font-weight: 600; font-size: 15px; background: var(--leather); border: 2px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze-dk); white-space: nowrap; }
.rail a:hover { color: var(--gold); box-shadow: inset 0 0 0 2px var(--bronze); }
.rail a[aria-current="page"] { color: var(--ink); background: var(--parch-hi) var(--tex) 0 0 / 128px; box-shadow: inset 0 0 0 2px var(--bronze-hi); }
.rail a b { font: 400 11px/1 var(--font-num); color: var(--bronze-hi); }
.rail a[aria-current="page"] b { color: var(--bronze-dk); }
.rail svg { width: 18px; height: 18px; flex: none; }

/* ---------- sections ---------- */
main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px var(--gut) 40px; display: grid; gap: 34px; min-height: 60vh; }
.sech { display: flex; align-items: center; margin: 0; font: 700 24px/1.15 var(--font-title); color: var(--ink); }
.sech::before, .sech::after { content: ""; flex: 1 1 0; min-width: 14px; height: 19px; image-rendering: pixelated; background: url(assets/mz-gold.png) 0 3px / 10px 13px repeat-x, var(--leather); border-block: 2px solid var(--bronze-dk); }
.sech > span { flex: none; max-width: 86%; padding: 7px 18px 6px; text-align: center; background: var(--parch-hi) var(--tex) 0 0 / 128px; image-rendering: pixelated; border: 3px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 3px var(--bronze-dk), 0 3px 0 rgba(0, 0, 0, .45); }
.sub { display: grid; gap: 14px; }
.sub > h3 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 700 20px/1.2 var(--font-title); color: var(--gold); text-shadow: 2px 2px 0 #000; }
.sub > h3 small { font: 400 13px/1 var(--font-num); color: var(--parch-3); }
.lead { margin: 0; color: var(--parch-2); max-width: 75ch; }
.parch { color: var(--ink); background-color: var(--parch); image-rendering: pixelated;
  background-image: var(--tex), radial-gradient(ellipse at 50% 42%, rgba(255, 250, 235, 0) 52%, rgba(150, 110, 55, .22) 100%); background-size: 128px 128px, 100% 100%;
  border: 3px solid var(--night); box-shadow: var(--fr-lg); }
.parch a { color: var(--bronze-dk); font-weight: 700; }

/* filter chips */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { padding: 4px 11px; font-size: 14px; font-weight: 600; color: var(--parch-2); background: var(--leather); border: 2px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze-dk); }
.filters button[aria-pressed="true"] { color: var(--ink); background: var(--gold); box-shadow: inset 0 0 0 2px var(--bronze-hi); }
.filters button b { font: 400 11px/1 var(--font-num); opacity: .8; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.card { position: relative; display: grid; grid-template-rows: auto 1fr; padding: 0; text-align: start; color: var(--ink); background: var(--parch) var(--tex) 0 0 / 128px; image-rendering: pixelated;
  border: 3px solid var(--night); box-shadow: var(--fr-sm); transition: transform .08s steps(2); text-decoration: none; }
.card:hover, .card:focus-visible { transform: translateY(-3px); }
.card .well { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; margin: 5px 5px 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 80%, #4a3524 0%, #2b1d13 55%, #1d130c 100%); box-shadow: inset 0 0 0 2px var(--bronze-dk), inset 0 -10px 18px rgba(0, 0, 0, .35); }
.card .well::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#f2cf72 1px, transparent 1.2px); background-size: 37px 29px; opacity: .25; }
.card .well img { position: relative; width: 96px; height: 96px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); }
.card .well img.ico { width: 72px; height: 72px; }
.card .well .ph { position: relative; width: 44px; height: 44px; color: var(--bronze); opacity: .45; } /* no picture yet: the category's pixel sign */
.card .well .ph svg { width: 100%; height: 100%; }
.card .well .lv { position: absolute; inset-inline-start: 6px; top: 6px; padding: 1px 6px 2px; font: 400 11px/1.3 var(--font-num); color: var(--gold); background: rgba(22, 14, 8, .85); box-shadow: inset 0 0 0 1px var(--bronze); direction: ltr; }
.card .well .tag { position: absolute; inset-inline-end: 6px; top: 6px; padding: 1px 6px 2px; font-size: 11px; font-weight: 700; color: var(--night); background: var(--gold); }
.card .well .tag.boss { background: #e04848; color: #fff; }
.card .well .tag.elite { background: var(--gold); }
.card .txt { display: grid; align-content: start; gap: 2px; padding: 8px 10px 10px; }
.card .nm { font: 700 15px/1.25 var(--font-title); color: var(--ink); }
.card .mt { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.card .rr { position: absolute; inset-inline: 5px; bottom: 5px; height: 3px; }
.card.r-epic { box-shadow: inset 0 0 0 2px var(--r-epic), inset 0 0 0 3px #5a2a8a, 0 3px 0 0 rgba(10, 6, 3, .5); }
.card.r-legendary { box-shadow: inset 0 0 0 2px var(--r-legendary), inset 0 0 0 3px #8a5a10, 0 3px 0 0 rgba(10, 6, 3, .5); }
.icons { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.icons img { width: 32px; height: 32px; image-rendering: pixelated; background: var(--leather); box-shadow: inset 0 0 0 1px var(--bronze-dk); }
.swatch { display: flex; height: 6px; margin-top: 5px; } .swatch i { flex: 1; }

/* rows (people, quests, dungeons) */
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; text-align: start; color: var(--ink); background: var(--parch) var(--tex) 0 0 / 128px; border: 3px solid var(--night); box-shadow: var(--fr-sm); }
.row img { width: 48px; height: 48px; image-rendering: pixelated; background: var(--leather); box-shadow: inset 0 0 0 1px var(--bronze-dk); }
.row .nm { font: 700 16px/1.25 var(--font-title); }
.row .mt { font-size: 13px; color: var(--ink-2); }
.row .end { font: 400 12px/1.4 var(--font-num); color: var(--bronze-dk); text-align: end; direction: ltr; }
.pill { display: inline-block; padding: 0 7px; font-size: 12px; font-weight: 700; color: var(--parch-hi); background: var(--leather); box-shadow: inset 0 0 0 1px var(--bronze); white-space: nowrap; }
.pill.gold { color: var(--ink); background: var(--gold); box-shadow: none; }
.pill.teal { color: #06302c; background: var(--teal); box-shadow: none; }
.pill.red { color: #fff; background: #b8323a; box-shadow: none; }
.rar { font-weight: 700; } .rar.normal { color: #6a6458; } .rar.epic { color: #7a2ad0; } .rar.legendary { color: #b06a00; }
.dot { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-inline-end: 4px; box-shadow: 0 0 0 1px var(--night); }

/* the overview: one tablet per category */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.cat { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; padding: 14px 16px; text-decoration: none; }
.cat .pics { position: relative; width: 84px; height: 84px; background: radial-gradient(ellipse at 50% 80%, #4a3524 0%, #2b1d13 60%); box-shadow: inset 0 0 0 2px var(--bronze-dk); display: grid; place-items: center; }
.cat .pics img { width: 72px; height: 72px; image-rendering: pixelated; }
.cat h3 { margin: 0; font: 700 21px/1.15 var(--font-title); color: var(--ink); }
.cat p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.cat b.n { font: 400 13px/1 var(--font-num); color: var(--bronze-dk); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 5px 8px; text-align: start; border-bottom: 1px solid rgba(106, 69, 24, .35); vertical-align: top; }
.tbl th { font-weight: 700; color: var(--ink); background: rgba(190, 168, 119, .35); white-space: nowrap; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.n { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .tbl td.n, [dir="rtl"] .tbl th.n { text-align: left; } /* (numbers line up on the reading end, headers with them) */
.tbl tr.on td { background: rgba(242, 207, 114, .45); font-weight: 600; }
.tblwrap { overflow-x: auto; }

/* bars (mount speeds, set package) */
.bars { display: grid; gap: 4px; }
.bars div { display: grid; grid-template-columns: 74px 1fr 46px; gap: 8px; align-items: center; font-size: 13px; }
.bars i { height: 10px; background: var(--leather); box-shadow: inset 0 0 0 1px var(--night); position: relative; }
.bars i::after { content: ""; position: absolute; inset: 2px; width: calc(var(--v) * (100% - 4px)); background: linear-gradient(var(--gold), var(--bronze)); }
.bars span:last-child { text-align: end; font: 400 11px/1 var(--font-num); direction: ltr; }

/* the world map */
.map { position: relative; width: 100%; aspect-ratio: 1; background: #cdbb8e center / 100% 100% no-repeat; image-rendering: pixelated; border: 3px solid var(--night); box-shadow: var(--fr-lg); overflow: hidden; }
.map .mk { position: absolute; transform: translate(-50%, -50%); width: 12px; height: 12px; padding: 0; border: 2px solid var(--night); background: var(--gold); }
.map .mk.city, .map .mk.home { width: 16px; height: 16px; background: #e04848; }
.map .mk.town { width: 14px; height: 14px; background: #e8a33a; }
.map .mk.village { background: #f2e6c4; }
.map .mk.landmark { background: #b46cff; transform: translate(-50%, -50%) rotate(45deg); }
.map .mk.cave { width: 10px; height: 10px; background: #4a3524; box-shadow: 0 0 0 1px var(--parch-3); border-radius: 50% 50% 0 0; }
.map .mk.waystone { width: 9px; height: 9px; background: var(--teal); }
.map .mk.realm { background: #7af0dc; border-radius: 50%; }
.map .lb { position: absolute; transform: translate(-50%, 9px); padding: 0 4px; font: 700 11px/1.35 var(--font-body); color: var(--ink); background: rgba(242, 233, 211, .88); box-shadow: 0 0 0 1px var(--night); white-space: nowrap; pointer-events: none; }
.map .pin { position: absolute; width: 18px; height: 26px; transform: translate(-50%, -100%); background: #e04848; clip-path: polygon(50% 100%, 0 40%, 0 15%, 15% 0, 85% 0, 100% 15%, 100% 40%); box-shadow: 0 0 0 2px var(--night); filter: drop-shadow(0 2px 0 var(--night)); animation: bob 1s steps(2) infinite alternate; }
@keyframes bob { to { margin-top: -3px; } }
.minimap { position: relative; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border: 3px solid var(--night); box-shadow: var(--fr-sm); background-color: #cdbb8e; background-repeat: no-repeat; overflow: hidden; }
.minimap .pin { position: absolute; left: 50%; top: 50%; width: 16px; height: 22px; transform: translate(-50%, -100%); background: #e04848; clip-path: polygon(50% 100%, 0 40%, 0 15%, 15% 0, 85% 0, 100% 15%, 100% 40%); }
.minimap .d { position: absolute; width: 8px; height: 8px; transform: translate(-50%, -50%); background: var(--gold); box-shadow: 0 0 0 2px var(--night); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--parch-2); }
.legend label { display: inline-flex; align-items: center; gap: 6px; }
.legend input { accent-color: var(--bronze-hi); }

/* ---------- the detail tablet (a dialog) ---------- */
dialog { width: min(900px, calc(100vw - 24px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); padding: 0; color: var(--ink); background: transparent; border: 0; overflow: visible; }
dialog::backdrop { background: rgba(10, 6, 3, .72); }
.dlg { position: relative; display: grid; max-height: inherit; overflow: hidden; }
.dlg .in { overflow-y: auto; padding: 26px 28px 26px; display: grid; gap: 16px; overscroll-behavior: contain; }
.dlg .x { position: absolute; inset-inline-end: 12px; top: 12px; z-index: 2; width: 40px; height: 40px; border: 3px solid var(--night); background: var(--leather); color: var(--gold); box-shadow: inset 0 0 0 2px var(--bronze); font: 700 20px/1 var(--font-body); }
.dhead { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding-inline-end: 44px; }
.dhead .big { display: grid; place-items: center; width: 168px; height: 168px; background: radial-gradient(ellipse at 50% 80%, #4a3524 0%, #2b1d13 60%, #1d130c 100%); box-shadow: inset 0 0 0 3px var(--bronze-dk); }
.dhead .big img { width: 144px; height: 144px; image-rendering: pixelated; }
.dhead .big img.ico { width: 96px; height: 96px; }
.dhead h2 { margin: 0; font: 700 28px/1.1 var(--font-title); color: var(--ink); }
.dhead .sub2 { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.dhead .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.dsec { display: grid; gap: 8px; }
.dsec h4 { margin: 0; font: 700 17px/1.2 var(--font-title); color: var(--bronze-dk); display: flex; align-items: center; gap: 8px; }
.dsec h4::after { content: ""; flex: 1; height: 3px; background: url(assets/mz-gold.png) 0 50% / 8px 10px repeat-x; opacity: .7; }
.dsec p { margin: 0; }
.quote { margin: 0; padding: 8px 14px; font-style: italic; color: var(--ink-2); border-inline-start: 4px solid var(--bronze); background: rgba(190, 168, 119, .25); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.cols > * { display: grid; align-content: start; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-weight: 600; }
.seg { display: inline-flex; border: 2px solid var(--night); }
.seg button { padding: 3px 10px; border: 0; font-size: 13px; font-weight: 700; background: var(--parch-2); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--leather); color: var(--gold); }
.empty { padding: 30px; text-align: center; color: var(--parch-2); }
.loading { padding: 60px 20px; text-align: center; color: var(--parch-2); font: 400 14px/1.6 var(--font-num); }
.res h3 { margin: 6px 0 0; }

footer { margin-top: 30px; padding: 0 var(--gut) 34px; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--parch-3); font-size: 14px; }
footer .band { width: 100%; max-width: 1100px; }
footer p { margin: 0; }

@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) {
  .bar nav a:not(.wikilink) { display: none; }
  .whead { padding-top: 22px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .card .well img { width: 72px; height: 72px; } .card .well img.ico { width: 56px; height: 56px; }
  main { padding-top: 20px; gap: 26px; }
  .sech { font-size: 20px; }
  dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; }
  .dlg { height: 100%; max-height: 100%; } .dlg .in { padding: 20px 16px 28px; }
  .dhead { grid-template-columns: 1fr; justify-items: center; text-align: center; padding-inline-end: 0; padding-top: 22px; }
  .dhead .tags { justify-content: center; }
  .dhead .big { width: 140px; height: 140px; } .dhead .big img { width: 120px; height: 120px; }
  .row { grid-template-columns: auto 1fr; } .row .end { grid-column: 2; text-align: start; }
}
@media (max-width: 420px) { .brand span { font-size: 17px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }

  ['mounts', 'M6 4h8v2h2v2h2v4h-2v8h-2v-6H8v6H6v-6H4V8h2zm4 2v2h2V6z'],

  ['quests', 'M5 2h11l3 3v15H5zm3 5v2h8V7zm0 4v2h8v-2zm0 4v2h5v-2z'],

let L = 'en', D = null, IDX = null, route = { cat: 'overview' }, mFilter = 'all', gRar = 'normal';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = (k, o) => { let s = T[L][k] ?? T.en[k] ?? k; if (o) for (const [a, b] of Object.entries(o)) s = s.replace('{' + a + '}', b); return s; };
const tx = (o) => (o == null ? '' : typeof o === 'string' ? o : o[L] || o.en || o.he || '');
const img = (f) => (f ? 'wiki/img/' + f : '');
const pct = (v, d = 1) => (v == null ? '–' : `${+(v * 100).toFixed(d)}%`);
const num = (v) => (v == null ? '–' : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'K' : Math.round(v).toLocaleString('en-US'));
const lvr = (r) => (r ? (r[0] === r[1] ? `${r[0]}` : `${r[0]}–${r[1]}`) : '');
const icon = (path) => `<svg viewBox="0 0 22 22" fill="currentColor" aria-hidden="true"><path d="${path}"/></svg>`;
const by = (list, k = 'id') => Object.fromEntries((list || []).map((x) => [x[k], x]));
let PL = {}, BI = {}, RG = {}, CL = {}, FAM = {}, WT = {}, ROLE = {}, TOWN = {};

// ------------------------------------------------------------------------------------------------ boot
async function boot() {
  L = SoLang.pick(); // lang.js: ?lang=he|en|es, the visitor's last choice, the browser's, English
  chrome();
  try { const r = await fetch('wiki/data.json'); if (!r.ok) throw new Error(r.status); D = await r.json(); }
  catch (e) { $('#view').innerHTML = `<p class="empty">${esc(t('loaderr'))}</p>`; return; }
  PL = by(D.places); BI = by(D.biomes); RG = by(D.regions); CL = by(D.monsterClasses); FAM = by(D.families); WT = by(D.weaponTypes); ROLE = by(D.roles); TOWN = by(D.towns);
  readHash(); render();
}
function chrome() {
  SoLang.show(L);
  $$('[data-t]').forEach((e) => { e.textContent = t(e.dataset.t); });
  $('#q').placeholder = t('search_ph'); $('#hint').innerHTML = t('hint');
  $('#qx').setAttribute('aria-label', { he: 'ניקוי החיפוש', en: 'Clear the search', es: 'Borrar la búsqueda' }[L]);

}
function rail() {

    people: (D?.towns || []).reduce((s, x) => s + x.people.length, 0) + (D?.characters?.length || 0), places: (D?.places?.length || 0) + (D?.dungeons?.length || 0), quests: D?.quests?.length };
  $('#rail').innerHTML = CATS.filter(([c]) => c === 'overview' || n[c]).map(([c, p]) => `<a href="#${c}"${route.cat === c && !route.q ? ' aria-current="page"' : ''}>${icon(p)}<span>${esc(t(c))}</span>${n[c] ? `<b>${n[c]}</b>` : ''}</a>`).join('');
}

// ------------------------------------------------------------------------------------------------ routing: #cat, #cat/id, #s=query
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('s=')) { route = { cat: 'search', q: h.slice(2) }; $('#q').value = route.q; $('#sbox').classList.toggle('has', !!route.q); return; }
  const [cat, ...rest] = h.split('/');
  route = { cat: CATS.some(([c]) => c === cat) ? cat : 'overview', id: rest.join('/') || null };
}
window.addEventListener('hashchange', () => { const was = route.cat; readHash(); if (route.cat !== was || route.cat === 'search') render(); if (route.id) openItem(route.cat, route.id); else closeDlg(true); });

function render() {
  rail();
  const v = $('#view');
  if (route.cat === 'search') { v.innerHTML = searchView(route.q); bindCards(v); return; }
  v.innerHTML = ({ overview, monsters, gear, skills, mounts, people, places, quests })[route.cat]();
  bindCards(v);
  if (route.id) openItem(route.cat, route.id);
}
function bindCards(root) {
  $$('[data-open]', root).forEach((e) => e.addEventListener('click', (ev) => { ev.preventDefault(); const [c, id] = e.dataset.open.split('|'); go(c, id); }));
  $$('[data-filter]', root).forEach((b) => b.addEventListener('click', () => { mFilter = b.dataset.filter; render(); }));
  $$('[data-mk]', root).forEach((b) => b.addEventListener('change', () => { $('#wmap')?.classList.toggle('no-' + b.dataset.mk, !b.checked); $$(`#wmap .mk.${b.dataset.mk}, #wmap .lb.${b.dataset.mk}`).forEach((e) => { e.hidden = !b.checked; }); }));
}
function go(cat, id) { const h = '#' + cat + (id ? '/' + encodeURIComponent(id) : ''); if (location.hash === h) openItem(cat, id); else location.hash = h; }

const sec = (title, body, id) => `<section class="sub"${id ? ` id="${id}"` : ''}><h2 class="sech"><span>${esc(title)}</span></h2>${body}</section>`;

const itemCard = (p) => card({ cat: 'gear', id: 'item:' + p.id, img: p.img, ico: true, name: tx(p.name), lv: `${t('lv')} ${p.lvl}`, meta: esc(catName(p.cat)) + (p.family ? ' · ' + esc(tx(FAM[p.family]?.name)) : '') });

const STAT_KEYS = ['power', 'atkSpeed', 'crit', 'defense', 'hp', 'move', 'block', 'dps'];

  const S = p.stats?.[gRar] || p.stats?.normal || [], weapon = p.slot === 'weapon' && p.cat !== 'shield';
  const keys = STAT_KEYS.filter((k) => S.some((s) => s[k] != null && s[k] !== 0));
  if (!S.length || !keys.length) return '';
  return `<div class="tblwrap"><table class="tbl"><tr><th></th>${S.map((s) => `<th class="n">${esc(t('lv'))} ${s.lvl}</th>`).join('')}</tr>${keys.map((k) => `<tr><td>${esc(t(k))}</td>${S.map((s) => `<td class="n">${statVal(k, s[k], weapon) ?? '–'}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const rarSeg = () => `<span class="seg" role="group">${(D.rarities || [{ id: 'normal' }]).map((r) => `<button type="button" data-rar="${r.id}" aria-pressed="${gRar === r.id}" class="rar ${r.id}">${esc(tx(r.name) || r.id)}</button>`).join('')}</span>`;
function setDetail(s) {
  const pkg = s.pkg ? `<div class="bars">${['power', 'atkSpeed', 'crit', 'defense'].map((k) => `<div><span>${esc(t(k))}</span><i style="--v:${Math.min(1, (s.pkg[k] || 0) / .25)}"></i><span>+${pct(s.pkg[k])}</span></div>`).join('')}</div>` : '';

    ${s.colors ? `<span class="swatch" style="height:10px;max-width:220px">${s.colors.map((c) => `<i style="background:${esc(c)}"></i>`).join('')}</span>` : ''}</div></div>

function miniMap(x, z, dots = [], span = 520) {
  if (!D.map?.img) return '';

  const dd = dots.map((d) => { const du = (d.x - x) / span, dv = (d.z - z) / (span * .75); if (Math.abs(du) > .5 || Math.abs(dv) > .5) return ''; return `<i class="d" title="${esc(d.title || '')}" style="left:${(50 + du * 100).toFixed(2)}%;top:${(50 + dv * 100).toFixed(2)}%"></i>`; }).join('');
  return `<div class="minimap" style="background-image:url(${img(D.map.img)});background-size:${(k * 100).toFixed(1)}% auto;background-position:${(((u * k) - .5) / (k - 1) * 100).toFixed(3)}% ${(((v * k * 4 / 3) - .5) / (k * 4 / 3 - 1) * 100).toFixed(3)}%">${dd}<span class="pin"></span></div>`;

// ------------------------------------------------------------------------------------------------ the detail dialog
function find(cat, id) {
  if (cat === 'monsters') { const m = MON()[id]; return m && monDetail(m); }
  if (cat === 'skills') { const s = (D.skills || []).find((x) => x.id === id); return s && skDetail(s); }
  if (cat === 'mounts') { const s = (D.mounts || []).find((x) => x.id === id); return s && mtDetail(s); }
  if (cat === 'quests') { const s = (D.quests || []).find((x) => x.id === id); return s && questDetail(s); }
  const [k, ...r] = id.split(':'), v = r.join(':');
  if (cat === 'gear') {
    if (k === 'set') { const s = (D.sets || []).find((x) => x.id === v); return s && setDetail(s); }
    if (k === 'item') { const p = (D.standalone || []).find((x) => x.id === v) || (D.sets || []).flatMap((s) => s.pieces).find((x) => x.id === v); return p && itemDetail(p); }
    if (k === 'heir') { const p = (D.heirlooms || []).find((x) => x.id === v); return p && itemDetail(p, true); }
  }
  if (cat === 'people') { if (k === 'town') return TOWN[v] && townDetail(TOWN[v]); if (k === 'char') { const c = (D.characters || []).find((x) => x.key === v); return c && charDetail(c); } }
  if (cat === 'places') { if (k === 'place') return PL[v] && placeDetail(PL[v]); if (k === 'reg') return RG[v] && regDetail(RG[v]); if (k === 'dun') { const d = (D.dungeons || []).find((x) => x.id === v); return d && dunDetail(d); } }
  return null;
}
let lastFocus = null;
function openItem(cat, id) {
  const html = D && find(cat, id); if (!html) return;
  const dlg = $('#dlg'), box = $('#dlgin');
  box.innerHTML = html; box.scrollTop = 0; bindCards(box);
  $$('[data-rar]', box).forEach((b) => b.addEventListener('click', () => { gRar = b.dataset.rar; openItem(cat, id); }));
  if (!dlg.open) { lastFocus = document.activeElement; dlg.showModal(); }
}
function closeDlg(fromHash) {
  const dlg = $('#dlg'); if (!dlg.open) return;
  dlg.close();
  if (!fromHash && route.id) { route.id = null; history.replaceState(null, '', location.pathname + location.search + (route.cat === 'search' ? '#s=' + encodeURIComponent(route.q) : '#' + route.cat)); }
  lastFocus?.focus?.({ preventScroll: true });
}
$('#dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg' || e.target.closest('[data-a=close]')) closeDlg(); });
$('#dlg').addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(); });

// ------------------------------------------------------------------------------------------------ search: every name and line, both languages
const norm = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[֑-ׇ̀-ͯ]/g, '').replace(/[’'״"׳]/g, '');
function index() {
  const out = [], add = (cat, id, name, text, card2) => out.push({ cat, id, name, k: norm([name?.he, name?.en, ...(text || []).flatMap((x) => (x && typeof x === 'object' ? [x.he, x.en] : [x]))].join(' ')), card: card2 });
  for (const m of D.monsters || []) add('monsters', m.id, m.name, [m.id, CL[m.cls]?.name, m.info, ...(m.traits || [])], () => monCard(m));
  for (const s of D.sets || []) { add('gear', 'set:' + s.id, s.name, [s.theme, FAM[s.family]?.name, s.passive?.name], () => setCard(s)); for (const p of s.pieces) add('gear', 'item:' + p.id, p.name, [WT[p.cat]?.name], () => itemCard(p)); }
  for (const p of D.standalone || []) add('gear', 'item:' + p.id, p.name, [p.desc, WT[p.cat]?.name, FAM[p.family]?.name], () => itemCard(p));
  for (const s of D.skills || []) add('skills', s.id, s.name, [s.desc, s.source], () => skCard(s));
  for (const m of D.mounts || []) add('mounts', m.id, m.name, [m.desc, SPN(m.species)], () => mtCard(m));
  for (const s of D.towns || []) { add('people', 'town:' + s.id, s.name, [s.sub, ...s.people.flatMap((p) => [p.name, ROLE[p.role]?.name])], () => townCard(s)); }
  for (const c of D.characters || []) add('people', 'char:' + c.key, c.name, [c.quote], () => charCard(c));
  for (const p of D.places || []) if (!TOWN[p.id]) add('places', 'place:' + p.id, p.name, [p.sub], () => card({ cat: 'places', id: 'place:' + p.id, name: tx(p.name), meta: esc(kindName(p.kind)), lv: p.level ? `${t('lv')} ${p.level}` : '' }));
  for (const d of D.dungeons || []) add('places', 'dun:' + d.id, d.name, [d.sub, d.near && PL[d.near.id]?.name], () => card({ cat: 'places', id: 'dun:' + d.id, name: tx(d.name), meta: esc(t(d.kind)) + (d.near ? ' · ' + esc(tx(PL[d.near.id]?.name)) : ''), lv: d.level ? `${t('lv')} ${d.level}` : '' }));
  for (const q of D.quests || []) add('quests', q.id, q.title, [q.offer, ...(q.steps || [])], () => card({ cat: 'quests', id: q.id, name: tx(q.title), meta: giverOf(q), lv: q.lvl ? `${t('lv')} ${q.lvl}` : '' }));
  return out;
}
function searchView(q) {
  IDX ||= index();
  const words = norm(q).split(/\s+/).filter(Boolean); if (!words.length) return overview();
  const hits = IDX.map((e) => { const n = norm(tx(e.name)); let s = 0; for (const w of words) { if (!e.k.includes(w)) return null; s += n.startsWith(w) ? 3 : n.includes(w) ? 2 : 1; } return { e, s }; }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 120);
  if (!hits.length) return sec(t('results', { q }), `<p class="empty">${esc(t('none'))}</p>`);
  const groups = {}; for (const h of hits) (groups[h.e.cat] ||= []).push(h.e);
  return sec(t('results', { q }), Object.entries(groups).map(([c, l]) => `<section class="sub res">${subh(t(c), l.length)}<div class="grid">${l.map((e) => e.card()).join('')}</div></section>`).join(''));
}
let sT = 0;
$('#q').addEventListener('input', (e) => {
  const v = e.target.value; $('#sbox').classList.toggle('has', !!v);
  clearTimeout(sT); sT = setTimeout(() => {
    if (v.trim()) { route = { cat: 'search', q: v }; history.replaceState(null, '', '#s=' + encodeURIComponent(v)); }
    else { route = { cat: 'overview' }; history.replaceState(null, '', location.pathname + location.search); }
    render();
  }, 140);
});
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#view').scrollIntoView({ block: 'start' }); } if (e.key === 'Escape') { e.target.value = ''; e.target.dispatchEvent(new Event('input')); } });
$('#qx').addEventListener('click', () => { const i = $('#q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName) && !$('#dlg').open) { e.preventDefault(); $('#q').focus(); } });
SoLang.mount((l) => { L = l; chrome(); IDX = null; if (D) { render(); if (route.id) openItem(route.cat, route.id); } });
boot();
</script>
