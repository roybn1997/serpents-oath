<script>
const T = {"he":{"title":"אפליקציית Companion: הכפר הקטן שלך","tag":"בטא","h":"הכפר הקטן שלך","lead":"אפליקציה נלווית למשחק: כפר שקט ומלא חיים שבו הדמות האמיתית שלך הולכת, מדברת עם תושבים ועובדת בשבילך גם כשאת/ה רחוק/ה מהמחשב. נכנסים עם אותו חשבון של המשחק.","dl":"פתיחת האפליקציה","soon":"בדפדפן, בלי הורדה","dlnote":"האפליקציה היא אתר שמתקינים על המסך הראשי, בלי חנות אפליקציות. כניסה עם אותו שם משתמש וסיסמה של המשחק.","h1":"מה זה","p1":"כפר קטן בתלת-ממד באותו סגנון פיקסל-ארט של המשחק: כמה בתים, כנסייה, ואגם גדול שרואים ממנו רק חלק. בלי קרבות ובלי עולם פתוח. הדמות שלך נראית בדיוק כמו במשחק, עם הציוד הנוכחי שלה.","h2":"פעילויות AFK","p2":"כרגע פעיל הדייג. בהמשך יתווספו שליחויות, איסוף עשבים, גינון, בישול ותפילה. מתחילים, סוגרים את האפליקציה וחוזרים לקבל את התוצאות. השרת סופר את הזמן, לא המכשיר, ויש תקרה לזמן שאפשר לצבור כשלא מחוברים.","h3":"דייג: שבעה דגים","p3":"הדייג של האגם תופס דג כל כמה דקות. יש שבעה סוגים, מדג בריכה נפוץ ועד דג הנחש העתיק, נדיר מאוד. מוכרים דגים תמורת אסימוני אגם ואוספים את כל הסוגים בספר הדגים.","h4":"בנק משותף לכל החשבון","p4":"אצל הבנקאי יש בנק אחד לכל החשבון עם 10 משבצות: מפקידים עם דמות אחת ומושכים עם דמות אחרת. הבנקאי נמצא גם במשחק, באלאיה. פריטי משחק נשארים במשחק ואפשר להוציא אותם רק שם, ודגים רק באפליקציה. האפליקציה לא נוגעת בתיק של הדמות במשחק.","h5":"כללים הוגנים","li":["חשבון אחד ודמות אחת: דמות לא יכולה להיות פעילה במשחק ובאפליקציה באותו זמן. כשהדמות במשחק האפליקציה לא נותנת להיכנס אליה.","פעילות אחת לכל דמות, והיא מושהית בזמן שהדמות במשחק.","הכול מחושב ונשמר בשרת. אין שום יתרון בקרב."],"h6":"איך מתקינים","steps":["אנדרואיד: פותחים את האפליקציה ב-Chrome, בתפריט (שלוש נקודות) בוחרים \"התקנת אפליקציה\" או \"הוספה למסך הבית\".","אייפון: פותחים ב-Safari, לוחצים על כפתור השיתוף ובוחרים \"הוסף למסך הבית\".","נכנסים עם שם המשתמש והסיסמה של המשחק ובוחרים דמות."],"back":"חזרה לדף הבית"},"en":{"title":"Companion app: your little village","tag":"Beta","h":"Your little village","lead":"A companion app for the game: a quiet, lively village where your real character walks, talks to the residents and works for you even when you are away from the PC. You sign in with the same account as the game.","dl":"Open the app","soon":"in your browser, no download","dlnote":"The app is a web app you install to your home screen. There is no app store. Sign in with the same username and password as the game.","h1":"What it is","p1":"A tiny 3D village in the same pixel-art style as the game: a few houses, a church, and a large lake of which you only see a part. No combat and no open world. Your character looks exactly as in the game, with the gear it wears now.","h2":"AFK activities","p2":"Fishing is live now. Errands, herb gathering, gardening, cooking and prayer come later. Start one, close the app and come back for the results. The server counts the time, not your device, and there is a cap on how much you can collect while away.","h3":"Fishing: seven fish","p3":"The lake's fisherman catches a fish every few minutes. There are seven kinds, from the common Pond Minnow to the Ancient Lake Serpentfish, very rare. Sell fish for Lake Tokens and collect every kind in the fish book.","h4":"One bank for the whole account","p4":"The banker keeps one 10-slot bank for the whole account: deposit with one character and withdraw with another. The Banker is in the game too, in Elaia. Game items stay game items and come out only there; fish come out only in the app. The app never touches the character's bag in the game.","h5":"Fair rules","li":["One account and one character: a character cannot be active in the game and in the app at the same time. While it is in the game, the app will not let you in.","One activity per character, paused while the character is in the game.","Everything is calculated and saved on the server. Nothing gives an edge in combat."],"h6":"How to install","steps":["Android: open the app in Chrome, open the menu (three dots) and choose \"Install app\" or \"Add to Home screen\".","iPhone: open it in Safari, tap the Share button and choose \"Add to Home Screen\".","Sign in with your game username and password and pick a character."],"back":"Back to the home page"},"es":{"title":"App Companion: tu pequeña aldea","tag":"Beta","h":"Tu pequeña aldea","lead":"Una app complementaria del juego: una aldea tranquila y viva donde tu personaje real camina, habla con los vecinos y trabaja para ti aunque estés lejos del PC. Entras con la misma cuenta del juego.","dl":"Abrir la app","soon":"en el navegador, sin descarga","dlnote":"La app es una web app que se instala en la pantalla de inicio. No hay tienda de apps. Entra con el mismo usuario y contraseña del juego.","h1":"Qué es","p1":"Una pequeña aldea en 3D con el mismo estilo pixel art del juego: unas pocas casas, una iglesia y un gran lago del que solo ves una parte. Sin combate y sin mundo abierto. Tu personaje se ve igual que en el juego, con el equipo que lleva ahora.","h2":"Actividades AFK","p2":"Ahora mismo funciona la pesca. Los recados, la recolección de hierbas, la jardinería, la cocina y la oración llegarán después. Empieza una, cierra la app y vuelve por los resultados. El servidor cuenta el tiempo, no tu dispositivo, y hay un tope de lo que se acumula estando ausente.","h3":"Pesca: siete peces","p3":"El pescador del lago pesca un pez cada pocos minutos. Hay siete tipos, desde la común Carpita de estanque hasta la Serpiente del lago antigua, muy rara. Vende peces por Fichas del lago y colecciona todos en el libro de peces.","h4":"Un banco para toda la cuenta","p4":"El banquero guarda un banco de 10 casillas para toda la cuenta: deposita con un personaje y retira con otro. El Banquero también está en el juego, en Elaia. Los objetos del juego solo se sacan allí; los peces solo en la app. La app nunca toca la bolsa del personaje en el juego.","h5":"Reglas justas","li":["Una cuenta y un personaje: un personaje no puede estar activo en el juego y en la app a la vez. Mientras está en el juego, la app no deja entrar.","Una actividad por personaje, en pausa mientras el personaje está en el juego.","Todo se calcula y se guarda en el servidor. Nada da ventaja en combate."],"h6":"Cómo instalar","steps":["Android: abre la app en Chrome, abre el menú (tres puntos) y elige \"Instalar app\" o \"Añadir a la pantalla de inicio\".","iPhone: ábrela en Safari, toca Compartir y elige \"Añadir a pantalla de inicio\".","Entra con tu usuario y contraseña del juego y elige un personaje."],"back":"Volver al inicio"}};
function render(L) {
  const t = T[L] || T.en;
  SoLang.fill(T, L);
  const pre = L === 'he' ? '\u200f' : '';
  for (const [id, k] of [['rules', 'li'], ['steps', 'steps']]) {
    const ul = document.getElementById(id); ul.textContent = '';
    for (const s of t[k]) { const li = document.createElement('li'); li.textContent = pre + s; ul.append(li); }
  }
  document.title = t.title + ' · The Serpent\'s Oath';
}
SoLang.mount((L) => SoLang.show(L));
document.addEventListener('so-lang', (e) => render(e.detail));
SoLang.show(SoLang.pick());
</script>
