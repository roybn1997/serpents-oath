<script>
const T = {"he": {"title": "אפליקציית Companion: הכפר הקטן שלך", "tag": "בפיתוח", "h": "הכפר הקטן שלך", "lead": "אפליקציה נלווית למשחק: כפר שקט ומלא חיים שבו הדמות האמיתית שלך הולכת, מדברת עם תושבים ועובדת בשבילך גם כשאת/ה רחוק/ה מהמחשב. נכנסים עם אותו חשבון של המשחק.", "dl": "הורדה", "soon": "בקרוב", "dlnote": "האפליקציה עדיין בפיתוח. כשתהיה מוכנה, כפתורי ההורדה יופיעו כאן. עד אז אין שום קובץ להורדה.", "h1": "מה זה", "p1": "כפר קטן בתלת-ממד באותו סגנון פיקסל-ארט של המשחק: כמה בתים, כנסייה, ואגם גדול שרואים ממנו רק חלק. בלי קרבות ובלי עולם פתוח. הדמות שלך נראית בדיוק כמו במשחק, עם הציוד הנוכחי שלה.", "h2": "פעילויות AFK", "p2": "כל תושב מציע פעילות פשוטה: דייג, שליחויות, איסוף עשבים, גינון, בישול, אומנות ותפילה בכנסייה. מתחילים, סוגרים את האפליקציה, וחוזרים לקבל את התוצאות. השרת מחשב את הזמן, לא המכשיר שלך, ויש תקרה לזמן שאפשר לצבור כשלא מחוברים.", "h3": "דייג: שבעה דגים", "p3": "הדייג של האגם תופס דג כל כמה דקות. יש שבעה סוגים, מדג בריכה נפוץ ועד דג הנחש העתיק, אגדי ונדיר מאוד. מוכרים דגים תמורת מטבעות, מבצעים בקשות יומיות ואוספים את כל הסוגים.", "h4": "הנרתיק החדש ובנק משותף", "p4": "לאפליקציה נרתיק חדש ונוח למסך מגע. כל מה שמרוויחים הוא פריט אמיתי במשחק, ומופיע בנרתיק של הדמות גם בתוך המשחק. אצל הבנקאי בכפר יש בנק אחד לכל החשבון עם 10 משבצות: מפקידים עם דמות אחת ומושכים עם דמות אחרת. אותו בנק יופיע גם במשחק.", "h5": "כללים הוגנים", "li": ["חשבון אחד ודמות אחת: דמות לא יכולה להיות פעילה במשחק ובאפליקציה באותו זמן.", "פעילות אחת לכל דמות, והיא נעצרת כשהדמות מחוברת למשחק.", "הכול מחושב ונשמר בשרת, עם מגבלות יומיות ושבועיות. שיקויי ניסיון נדירים ומוגבלים מאוד.", "שום דבר לא נותן יתרון בקרב. הפרסים הם בעיקר קוסמטיקה וחומרים."], "h6": "השלבים", "steps": ["כניסה, בחירת דמות והכפר עצמו", "נעילת דמות בין המשחק לאפליקציה", "נרתיק ובנק משותף", "דייג", "שאר התושבים והפעילויות"], "back": "חזרה לדף הבית"}, "en": {"title": "Companion app: your little village", "tag": "In development", "h": "Your little village", "lead": "A companion app for the game: a quiet, lively village where your real character walks, talks to the residents and works for you even when you are away from the PC. You sign in with the same account as the game.", "dl": "Download", "soon": "Coming soon", "dlnote": "The app is still in development. The download buttons will appear here when it is ready. Until then there is no file to download.", "h1": "What it is", "p1": "A tiny 3D village in the same pixel-art style as the game: a few houses, a church, and a large lake of which you only see a part. No combat and no open world. Your character looks exactly as in the game, with the gear it wears now.", "h2": "AFK activities", "p2": "Every resident offers a simple activity: fishing, errands, herb gathering, gardening, cooking, crafting and prayer at the church. Start one, close the app and come back for the results. The server counts the time, not your device, and there is a cap on how much you can collect while away.", "h3": "Fishing: seven fish", "p3": "The lake's fisherman catches a fish every few minutes. There are seven kinds, from the common Pond Minnow to the Ancient Lake Serpentfish, a legendary and very rare catch. Sell fish for coins, do the daily requests and collect every kind.", "h4": "A new satchel and a shared bank", "p4": "The app has a new satchel made for touch screens. Everything you earn is a real item in the game and shows in the character's satchel inside the game too. At the banker in the village there is one bank for the whole account with 10 slots: deposit with one character and withdraw with another. The same bank will appear in the game.", "h5": "Fair rules", "li": ["One account and one character: a character cannot be active in the game and in the app at the same time.", "One activity per character, and it pauses while the character is logged in to the game.", "Everything is calculated and saved on the server, with daily and weekly limits. Experience potions are rare and strictly limited.", "Nothing gives an edge in combat. The rewards are mostly cosmetics and materials."], "h6": "The stages", "steps": ["Sign-in, choosing a character and the village itself", "A character lock between the game and the app", "The satchel and the shared bank", "Fishing", "The other residents and activities"], "back": "Back to the home page"}, "es": {"title": "App Companion: tu pequeña aldea", "tag": "En desarrollo", "h": "Tu pequeña aldea", "lead": "Una app complementaria del juego: una aldea tranquila y viva donde tu personaje real camina, habla con los vecinos y trabaja para ti aunque estés lejos del PC. Entras con la misma cuenta del juego.", "dl": "Descargar", "soon": "Próximamente", "dlnote": "La app aún está en desarrollo. Los botones de descarga aparecerán aquí cuando esté lista. Hasta entonces no hay ningún archivo para descargar.", "h1": "Qué es", "p1": "Una pequeña aldea en 3D con el mismo estilo pixel art del juego: unas pocas casas, una iglesia y un gran lago del que solo ves una parte. Sin combate y sin mundo abierto. Tu personaje se ve igual que en el juego, con el equipo que lleva ahora.", "h2": "Actividades AFK", "p2": "Cada vecino ofrece una actividad sencilla: pesca, recados, recolección de hierbas, jardinería, cocina, artesanía y oración en la iglesia. Empieza una, cierra la app y vuelve por los resultados. El servidor cuenta el tiempo, no tu dispositivo, y hay un límite de lo que se acumula estando fuera.", "h3": "Pesca: siete peces", "p3": "El pescador del lago saca un pez cada pocos minutos. Hay siete tipos, desde el común Pez de Estanque hasta el Pez Serpiente Ancestral del Lago, legendario y muy raro. Vende peces por monedas, cumple los encargos diarios y completa la colección.", "h4": "Una mochila nueva y un banco compartido", "p4": "La app tiene una mochila nueva pensada para pantallas táctiles. Todo lo que ganas es un objeto real del juego y también aparece en la mochila del personaje dentro del juego. En la aldea, el banquero ofrece un solo banco para toda la cuenta con 10 casillas: depositas con un personaje y retiras con otro. El mismo banco aparecerá en el juego.", "h5": "Reglas justas", "li": ["Una cuenta y un personaje: un personaje no puede estar activo en el juego y en la app a la vez.", "Una actividad por personaje, que se pausa mientras el personaje está conectado al juego.", "Todo se calcula y se guarda en el servidor, con límites diarios y semanales. Las pociones de experiencia son raras y estrictamente limitadas.", "Nada da ventaja en combate. Las recompensas son sobre todo cosméticos y materiales."], "h6": "Las etapas", "steps": ["Inicio de sesión, elegir personaje y la aldea", "Bloqueo de personaje entre el juego y la app", "La mochila y el banco compartido", "Pesca", "Los demás vecinos y actividades"], "back": "Volver al inicio"}};
function render(L) {
  const t = T[L] || T.en;
  SoLang.fill(T, L);
  const pre = L === 'he' ? '\u200f' : '';
  for (const [id, k] of [['rules', 'li'], ['steps', 'steps']]) {
    const ul = document.getElementById(id); ul.textContent = '';
    for (const s of t[k]) { const li = document.createElement('li'); li.textContent = pre + s; ul.append(li); }
  }
  document.title = t.title + ' · The Serpent\'s Oath';
}
SoLang.mount((L) => SoLang.show(L));
document.addEventListener('so-lang', (e) => render(e.detail));
SoLang.show(SoLang.pick());
</script>
