<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Serpent's Oath</title>
<meta name="description" content="The Serpent's Oath: המסע של Val להחזיר את Roye הביתה. משחק הרפתקאות בעולם פתוח של יוון המיתולוגית, ל-Windows. מורידים את המשגר, והוא מתקין ומעדכן את המשחק.">
<meta name="theme-color" content="#160e08">
<meta property="og:title" content="The Serpent's Oath">
<meta property="og:description" content="Val's journey to bring Roye home. An open-world adventure in mythic Greece, for Windows. Download the launcher; it installs and updates the game.">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="lang.css">
<style>
/* The Serpent's Oath site, in the game's own menu language: night sky, bronze frames, parchment, pixel sprites.
   Colours, frames and the title treatment are the game's style.css tokens. Every path is relative (GitHub Pages). */
:root {
  --parch: #e7ddc4; --parch-hi: #f2e9d3; --parch-2: #d9cba6; --parch-3: #bea877;
  --ink: #2b1a0e; --ink-2: #4a3220; --night: #160e08; --leather: #2b1d13; --leather-2: #3b291b;
  --bronze: #a8742c; --bronze-hi: #d9a441; --bronze-dk: #6a4518; --gold: #f2cf72; --teal: #34d1bf; --teal-dk: #1d8c80;
  --fr-lg: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 4px var(--bronze), inset 0 0 0 6px var(--night), inset 0 0 0 10px rgba(140, 100, 50, .15), 0 4px 0 0 rgba(10, 6, 3, .5);
  --fr-sm: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 3px var(--bronze-dk), 0 3px 0 0 rgba(10, 6, 3, .5);
  --tex: url(assets/tex-parch.png);
  --mz-gold: url(assets/mz-gold.png);
  --emblem: url(assets/emblem.png);
  --font-title: "Rubik", "Pixelify Sans", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, sans-serif;
  --font-num: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  --cur-arrow: url(assets/cur-arrow.png) 1 1, default;
  --cur-hand: url(assets/cur-hand.png) 1 1, pointer;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
html:not([lang="he"]) { --font-title: "Pixelify Sans", "Rubik", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; -webkit-text-size-adjust: 100%; }
html, body { cursor: var(--cur-arrow); }
body { margin: 0; min-height: 100vh; overflow-x: hidden; background: var(--night); color: var(--parch-hi); font: 400 17px/1.6 var(--font-body); }
a, button, summary, label { cursor: var(--cur-hand); }
a { color: var(--gold); }
img { max-width: 100%; display: block; }
bdi.ltr, .ltr { direction: ltr; unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* the night sky behind everything, with the menu's twinkling pixel stars */
.sky { position: fixed; inset: 0; z-index: -2; background: radial-gradient(ellipse at 50% 120%, #3b291b 0%, #160e08 60%); }
.sky::before, .sky::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#f2cf72 1.5px, transparent 1.6px), radial-gradient(#e7ddc4 1px, transparent 1.2px); background-size: 90px 70px, 57px 43px; background-position: 0 0, 20px 30px; opacity: .45; animation: tw 3.2s steps(2) infinite; }
.sky::after { background-size: 131px 97px, 77px 61px; background-position: 40px 12px, 9px 50px; opacity: .3; animation-delay: -1.6s; }
@keyframes tw { 50% { opacity: .15; } }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px var(--gut);
  background: rgba(22, 14, 8, .9); box-shadow: inset 0 -2px 0 var(--bronze-dk), 0 2px 0 rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--gold); text-decoration: none; font: 600 20px/1 "Pixelify Sans", sans-serif; white-space: nowrap; direction: ltr; text-shadow: 2px 2px 0 #000; }
.brand img { width: 32px; height: 32px; image-rendering: pixelated; }
.bar nav { display: flex; gap: 4px; margin-inline-start: auto; }
.bar nav a { padding: 6px 10px; color: var(--parch-2); text-decoration: none; font-weight: 500; font-size: 16px; }
.bar nav a:hover { color: var(--gold); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font: 600 16px/1.2 var(--font-body); color: var(--parch-hi); background: var(--leather); border: 2px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze); }
.chip:hover { background: var(--leather-2); color: var(--gold); }

/* ---------- hero: Athens from above, the town held still while the camera drifts ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; display: grid; place-items: center; min-height: min(88vh, 860px); min-height: min(88svh, 860px); padding: 48px var(--gut) 96px;
  background: #2b1d13 url(assets/hero.jpg) center / cover no-repeat; }
.hero video { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 60% 52% at 50% 46%, rgba(14, 9, 5, .55) 0%, rgba(14, 9, 5, 0) 100%),
              linear-gradient(to top, rgba(14, 9, 5, .95) 0%, rgba(14, 9, 5, .6) 22%, rgba(14, 9, 5, 0) 50%),
              linear-gradient(to bottom, rgba(14, 9, 5, .75) 0%, rgba(14, 9, 5, 0) 30%); }
.hero-in { display: grid; justify-items: center; gap: 16px; text-align: center; max-width: 900px; }
.logo { position: relative; padding-inline: 78px; }
.logo h1 { margin: 0; font: 700 clamp(44px, 8.2vw, 100px)/.98 "Pixelify Sans", sans-serif; color: var(--gold); letter-spacing: .02em; direction: ltr; text-wrap: balance;
  text-shadow: 3px 0 0 #1a110b, -3px 0 0 #1a110b, 0 3px 0 #1a110b, 0 -3px 0 #1a110b, 3px 3px 0 #1a110b, -3px 3px 0 #1a110b, 3px -3px 0 #1a110b, -3px -3px 0 #1a110b, 0 7px 0 #6a4518, 3px 7px 0 #1a110b, -3px 7px 0 #1a110b, 0 10px 0 #1a110b; }
.logo h1 span { display: inline-block; animation: drop .6s steps(6) both; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
/* the title's underline: a gold meander band with the bat-wing skull on a night block */
.band { width: min(560px, 84vw); height: 30px; image-rendering: pixelated;
  background: var(--emblem) center / 54px 22px no-repeat, linear-gradient(var(--night), var(--night)) center / 84px 30px no-repeat, var(--mz-gold) 0 50% / 20px 26px repeat-x; }
.tag { margin: 0; font-size: clamp(18px, 2.3vw, 23px); font-weight: 500; color: var(--parch-hi); text-shadow: 2px 2px 0 #000; text-wrap: balance; }

/* torches either side of the title, as in the menu */
.torch { position: absolute; top: 50%; width: 18px; height: 66px; margin-top: -24px; pointer-events: none; image-rendering: pixelated;
  background: linear-gradient(var(--bronze-hi), var(--bronze-hi)) 0 21px / 18px 3px no-repeat, linear-gradient(var(--bronze), var(--bronze)) 0 24px / 18px 6px no-repeat,
              linear-gradient(var(--bronze-dk), var(--bronze-dk)) 6px 30px / 6px 36px no-repeat, linear-gradient(var(--night), var(--night)) 3px 30px / 12px 36px no-repeat; }
.torch.l { left: 8px; } .torch.r { right: 8px; }
.torch::before { content: ""; position: absolute; left: 3px; top: 0; width: 12px; height: 21px; background: linear-gradient(#ffe08a, #ffe08a) 3px 9px / 6px 12px no-repeat, #ff9a2e;
  clip-path: polygon(25% 0, 75% 0, 75% 15%, 100% 15%, 100% 100%, 0 100%, 0 15%, 25% 15%); animation: fl .36s steps(2) infinite alternate; transform-origin: 50% 100%; }
.torch::after { content: ""; position: absolute; left: 50%; top: 10px; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(255, 170, 60, .32) 0%, rgba(255, 140, 40, .1) 40%, rgba(255, 140, 40, 0) 70%); animation: glow .72s steps(3) infinite alternate; }
@keyframes fl { to { transform: scaleY(.78); background-color: #ffb22e; } }
@keyframes glow { to { opacity: .7; transform: scale(.93); } }

/* the download tablet: the game's .slab, a size up */
.slab { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-width: 176px; min-height: 52px; padding: 11px 24px; text-decoration: none;
  font: 700 25px/1.1 var(--font-body); color: var(--ink); background: var(--parch-hi) var(--tex) 0 0 / 128px; image-rendering: pixelated; border: 3px solid var(--night);
  box-shadow: inset 0 0 0 2px var(--bronze-hi), inset 0 -5px 0 2px rgba(120, 85, 40, .28), 0 4px 0 0 var(--night); transition: transform .06s steps(2); }
html:not([lang="he"]) .slab { font-family: "Pixelify Sans", sans-serif; font-weight: 600; }
.slab:hover { transform: translateY(-2px); background-color: #fff6df; }
.slab:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--bronze-hi), 0 1px 0 0 var(--night); }
.slab.big { min-height: 70px; padding: 14px 34px 16px; font-size: clamp(22px, 3vw, 29px); }
.dlrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; width: min(880px, 100%); }
.slab .lbl > span { white-space: nowrap; }
.slab .lbl { display: grid; gap: 3px; text-align: start; }
.slab small { font: 500 15px/1.2 var(--font-body); color: var(--ink-2); letter-spacing: .02em; }
.macnote { max-width: 62ch; margin: 24px auto 0; text-align: center; line-height: 1.7; }
.slab .dl { flex: none; width: 21px; height: 24px; background: currentColor; clip-path: polygon(33% 0, 67% 0, 67% 42%, 100% 42%, 50% 88%, 0 42%, 33% 42%); }
.meta { margin: 2px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 15px; color: var(--parch-2); text-shadow: 2px 2px 0 #000; }
.meta b { font: 400 14px/1.6 var(--font-num); color: var(--gold); letter-spacing: .02em; direction: ltr; unicode-bidi: isolate; }
.meta .sep { color: var(--bronze); }
.req { margin: 0; font-size: 15px; color: var(--parch-2); text-shadow: 2px 2px 0 #000; }
.req a { color: var(--gold); }

/* the snake that slithers along the bottom of the hero, over the meander */
.trail { position: absolute; left: 0; right: 0; bottom: 30px; height: 30px; z-index: 1; overflow: hidden; pointer-events: none; direction: ltr; }
[dir="rtl"] .trail { transform: scaleX(-1); }
.snake { position: absolute; left: -260px; bottom: 3px; display: flex; align-items: flex-end; animation: slither 28s linear infinite; }
.snake i { flex: none; width: 12px; height: 12px; margin-right: -1px; background: var(--teal); box-shadow: inset 0 -3px 0 var(--teal-dk), inset 0 0 0 2px #0b3f3a;
  animation: wave 1s steps(4) infinite; animation-delay: calc(var(--i) * -.11s); }
.snake i:nth-child(3n) { background: #c9aa3a; box-shadow: inset 0 -3px 0 #8a6a1e, inset 0 0 0 2px #0b3f3a; }
.snake i:first-child { width: 8px; height: 6px; }
.snake i:nth-child(2) { width: 10px; height: 9px; }
.snake .hd { position: relative; width: 20px; height: 15px; background: var(--teal) linear-gradient(#160e08, #160e08) 12px 3px / 3px 3px no-repeat; box-shadow: inset 0 -3px 0 var(--teal-dk), inset 0 0 0 2px #0b3f3a; }
.snake .hd::after { content: ""; position: absolute; right: -7px; top: 8px; width: 7px; height: 2px; background: #d8343b; animation: tongue .9s steps(1) infinite; }
@keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes slither { to { left: calc(100% + 30px); } }
@keyframes tongue { 50% { width: 0; } }
.rule { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 1; image-rendering: pixelated; background: var(--emblem) center / 54px 22px no-repeat, linear-gradient(var(--night), var(--night)) center / 84px 30px no-repeat, var(--mz-gold) 0 50% / 20px 26px repeat-x, var(--night); }

/* ---------- sections ---------- */
main { display: grid; gap: 72px; padding: 56px 0 24px; }
.sec { width: 100%; max-width: 1100px; margin: 0 auto; padding-inline: var(--gut); display: grid; gap: 22px; }
/* section header from the equipment sheet: a framed parchment plate between two meander bands */
.sech { display: flex; align-items: center; margin: 0; font: 700 26px/1.15 var(--font-title); color: var(--ink); }
.sech::before, .sech::after { content: ""; flex: 1 1 0; min-width: 14px; height: 19px; image-rendering: pixelated;
  background: url(assets/mz-gold.png) 0 3px / 10px 13px repeat-x, var(--leather); border-block: 2px solid var(--bronze-dk); }
.sech > span { flex: none; max-width: 86%; padding: 8px 20px 7px; text-align: center; background: var(--parch-hi) var(--tex) 0 0 / 128px; image-rendering: pixelated; border: 3px solid var(--night);
  box-shadow: inset 0 0 0 2px var(--bronze-hi), inset 0 0 0 3px var(--bronze-dk), 0 3px 0 rgba(0, 0, 0, .45); }
.lead { margin: -6px auto 0; max-width: 62ch; text-align: center; color: var(--parch-2); text-wrap: balance; }

.parch { color: var(--ink); background-color: var(--parch); image-rendering: pixelated;
  background-image: var(--tex), radial-gradient(ellipse at 50% 42%, rgba(255, 250, 235, 0) 52%, rgba(150, 110, 55, .22) 100%); background-size: 128px 128px, 100% 100%;
  border: 3px solid var(--night); box-shadow: var(--fr-lg); }
.parch a { color: var(--bronze-dk); font-weight: 700; }

/* how to run: three tablets with the game's medal as the step number */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 0; padding: 0; list-style: none; }
.step { position: relative; display: grid; align-content: start; gap: 8px; padding: 26px 24px 24px; }
.medal { width: 52px; height: 52px; display: grid; place-items: center; background: url(assets/medal.png) center / 100% 100% no-repeat; image-rendering: pixelated;
  font: 400 20px/1 var(--font-num); color: var(--gold); text-shadow: 2px 2px 0 var(--night); }
.step h3 { margin: 4px 0 0; font: 700 22px/1.25 var(--font-title); }
.step p { margin: 0; color: var(--ink-2); }
.file { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 6px; font-weight: 700; color: var(--ink); background: var(--parch-2); box-shadow: inset 0 0 0 2px var(--parch-3); white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
.file img { width: 22px; height: 22px; image-rendering: pixelated; }
.step h3 .file { font-size: .92em; white-space: normal; }
.key { display: inline-block; padding: 0 8px; font-weight: 700; color: var(--parch-hi); background: var(--leather); box-shadow: inset 0 0 0 2px var(--bronze); white-space: nowrap; direction: ltr; unicode-bidi: isolate; }

.notes { padding: 24px 28px 22px; }
.notes h3 { margin: 0 0 10px; font: 700 21px/1.2 var(--font-title); }
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 30px; }
.notes li { position: relative; padding-inline-start: 26px; color: var(--ink-2); }
.notes li::before { content: ""; position: absolute; inset-inline-start: 0; top: 6px; width: 15px; height: 15px; background: url(assets/rivet.png) center / 100% 100% no-repeat; image-rendering: pixelated; }
.notes li b { color: var(--ink); }
.notes li.wide { grid-column: 1 / -1; }
.path { font: 700 15px/1.6 ui-monospace, Consolas, monospace; color: var(--ink); direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }

/* about: the story in a paragraph, what's in it, and real screenshots in bronze frames */
.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 26px; align-items: start; }
.about .txt { padding: 26px 28px 24px; display: grid; gap: 12px; }
.about .txt p { margin: 0; }
.feats { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; padding: 0; list-style: none; }
.feats li { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; font-weight: 500; font-size: 15px; color: var(--parch-hi); background: var(--leather); border: 2px solid var(--night); box-shadow: inset 0 0 0 2px var(--bronze); }
.feats img { width: 22px; height: 22px; image-rendering: pixelated; }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; }
.shot { margin: 0; display: grid; gap: 6px; }
.shot a { display: block; padding: 6px; background: var(--leather); border: 3px solid var(--night); box-shadow: var(--fr-sm); }
.shot img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; image-rendering: pixelated; background: var(--leather-2); }
.shot figcaption { font-size: 14px; color: var(--parch-2); text-align: center; }
.about + .shots { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; }
/* the clips: real gameplay, 8 s loops, loaded only when they scroll into view; a pause chip on each */
.clips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; }
.clip { margin: 0; display: grid; gap: 6px; align-content: start; }
.clip .fr { position: relative; padding: 6px; background: var(--leather); border: 3px solid var(--night); box-shadow: var(--fr-sm); }
.clip video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: var(--leather-2) center / cover no-repeat; }
.clip figcaption { font-size: 14px; color: var(--parch-2); text-align: center; }
.clip .pp { position: absolute; inset-inline-end: 12px; bottom: 12px; width: 30px; height: 30px; padding: 0; border: 2px solid var(--night); background: rgba(26, 17, 11, .78); box-shadow: inset 0 0 0 2px var(--bronze); cursor: pointer; display: grid; place-items: center; opacity: .75; }
.clip .pp:hover, .clip .pp:focus-visible { opacity: 1; }
.clip .pp:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.clip .pp i { width: 4px; height: 12px; background: var(--parch-hi); box-shadow: 6px 0 0 var(--parch-hi); transform: translateX(-3px); }
.clip .pp[aria-pressed="false"] i { width: 0; height: 0; background: none; box-shadow: none; transform: translateX(1px); border: solid transparent; border-width: 7px 0 7px 11px; border-left-color: var(--parch-hi); }
.wikiline { margin: 22px 0 0; display: flex; justify-content: center; }
.wikiline .slab { gap: 10px; }
.wikiline img { image-rendering: pixelated; }

/* the updates board: one parchment tablet per update, newest first */
.log { display: grid; gap: 14px; }
.upd { padding: 0; }
.upd summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 16px 22px 15px; list-style: none; }
.upd summary::-webkit-details-marker { display: none; }
.upd summary::after { content: ""; margin-inline-start: auto; flex: none; width: 14px; height: 9px; background: var(--bronze-dk); clip-path: polygon(0 0, 100% 0, 50% 100%); transition: transform .1s steps(2); }
.upd:not([open]) summary::after { transform: rotate(90deg); }
[dir="rtl"] .upd:not([open]) summary::after { transform: rotate(-90deg); }
.upd .dt { font: 400 15px/1.5 var(--font-num); color: var(--bronze-dk); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.upd .v { padding: 1px 9px; font-size: 14px; font-weight: 700; color: var(--parch-hi); background: var(--leather); box-shadow: inset 0 0 0 2px var(--bronze); white-space: nowrap; }
.upd .tt { font: 700 20px/1.3 var(--font-title); color: var(--ink); }
.upd .soon { padding: 1px 9px; font-size: 14px; font-weight: 700; color: #06302c; background: var(--teal); box-shadow: inset 0 0 0 2px var(--teal-dk); white-space: nowrap; animation: pulse 1.6s steps(2) infinite; }
@keyframes pulse { 50% { background: #74f0dc; } }
.upd.up { box-shadow: inset 0 0 0 2px #74f0dc, inset 0 0 0 4px var(--teal-dk), inset 0 0 0 6px var(--night), inset 0 0 0 10px rgba(52, 209, 191, .12), 0 4px 0 0 rgba(10, 6, 3, .5); }
.upd ul { margin: 0; padding: 0 22px 20px; list-style: none; display: grid; gap: 6px; }
.upd li { position: relative; padding-inline-start: 20px; color: var(--ink-2); }
.upd li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .62em; width: 7px; height: 7px; background: var(--bronze); box-shadow: 0 0 0 1px var(--bronze-dk); transform: rotate(45deg); }

.cta { display: grid; justify-items: center; gap: 14px; text-align: center; }
.cta h2 { margin: 0; font: 700 clamp(26px, 4vw, 38px)/1.15 var(--font-title); color: var(--gold); text-shadow: 3px 3px 0 #1a110b, 0 5px 0 #6a4518; }

footer { margin-top: 56px; padding: 0 var(--gut) 34px; display: grid; justify-items: center; gap: 12px; text-align: center; color: var(--parch-3); font-size: 15px; }
footer .band { width: 100%; max-width: 1100px; }
footer p { margin: 0; }
footer .brandline { font: 600 18px/1 "Pixelify Sans", sans-serif; color: var(--gold); direction: ltr; }

@media (max-width: 900px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .about { grid-template-columns: minmax(0, 1fr); }
  .notes ul { grid-template-columns: minmax(0, 1fr); }
  .dlrow { grid-template-columns: minmax(0, 1fr); width: min(440px, 100%); }
}
@media (max-width: 720px) {
  .bar nav { display: none; }
  .logo { padding-inline: 34px; }
  .torch { transform: scale(.62); transform-origin: 50% 30%; }
  .torch.l { left: -2px; } .torch.r { right: -2px; }
  .sech { font-size: 22px; }
  .shots, .clips { gap: 10px; }
  .shot a, .clip .fr { padding: 4px; }
  .about + .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  { src: 'assets/shot-4.jpg', he: 'קיקלופ והרפיה בשעת אחר הצהריים', en: 'A cyclops and a harpy in the late afternoon', es: 'Un cíclope y una arpía a media tarde' },
];

const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const MON = { en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], es: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'] };
const fmt = (d, L) => { const [y, m, dd] = d.split('-').map(Number); return L === 'he' ? `${dd}.${m}.${y}` : `${dd} ${MON[L][m - 1]} ${y}`; };
const PLAY = { he: 'הפעלה או השהיה', en: 'Play or pause', es: 'Reproducir o pausar' };
const SITE = window.SITE || {}, UPDATES = window.UPDATES || [];
const fill = (s) => s.replace('{mb}', SITE.LAUNCHER_MB || '').replace('{n}', UPDATES.length);
let L = 'en';

function render() {
  const t = T[L];
  SoLang.show(L);
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = fill(t[e.dataset.t]); });
  document.querySelectorAll('[data-h]').forEach((e) => { e.innerHTML = fill(t[e.dataset.h]); });
  // the version line under the button: the newest released update (an upcoming one isn't in the ZIP yet)
  const cur = UPDATES.find((u) => !u.upcoming), meta = $('#meta'); meta.textContent = '';
  const bit = (label, val) => { const s = el('span'); if (label) s.append(label + ' '); s.append(el('b', '', val)); return s; };
  const parts = [];
  if (cur?.v) parts.push(bit(t.ver, cur.v));
  if (cur?.date) parts.push(bit('', fmt(cur.date, L)));
  parts.forEach((p, i) => { if (i) meta.append(el('span', 'sep', '·')); meta.append(p); });
  document.querySelectorAll('.winsz').forEach((e) => { e.textContent = t.dl_sub + (SITE.LAUNCHER_MB ? '\u2066' + SITE.LAUNCHER_MB + ' ' + t.mb + '\u2069' : ''); });
  document.querySelectorAll('.macsz').forEach((e) => { e.textContent = t.mac_sub + (SITE.MAC_MB ? ' · \u2066' + SITE.MAC_MB + ' ' + t.mb + '\u2069' : ''); });
  document.querySelectorAll('a.intel').forEach((a) => { a.href = SITE.MAC_INTEL_URL || '#'; });
  $('#upd-sub').textContent = fill(t.upd_sub);
  shots(); clips(); board();
}

// each clip shows its poster until it comes near the screen, then loads and plays (muted, looping, inline on phones);
// off screen it pauses. With motion off it stays a still: the play chip starts it by hand.
const STILL = matchMedia('(prefers-reduced-motion: reduce)');
const near = 'IntersectionObserver' in window ? new IntersectionObserver((es) => {
  for (const e of es) { const v = e.target; if (e.isIntersecting) { load(v); if (!v.dataset.held) v.play().catch(() => {}); } else v.pause(); }
}, { rootMargin: '200px 0px' }) : null;
function load(v) {
  if (v.dataset.on) return; v.dataset.on = 1;
  for (const [ext, type] of [['webm', 'video/webm'], ['mp4', 'video/mp4']]) { const s = el('source'); s.src = `${v.dataset.src}.${ext}`; s.type = type; v.append(s); }
  v.load();
}
let clipsBuilt = false;
function clips() {
  const box = $('#clips');
  if (clipsBuilt) { // a language switch only changes the words
    box.querySelectorAll('.clip').forEach((f, i) => { f.querySelector('figcaption').textContent = CLIPS[i][L]; f.querySelector('video').setAttribute('aria-label', CLIPS[i][L]); f.querySelector('.pp').setAttribute('aria-label', PLAY[L]); });
    return;
  }
  clipsBuilt = true;
  for (const c of CLIPS) {
    const f = el('figure', 'clip'), fr = el('div', 'fr'), v = el('video'), b = el('button', 'pp');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none'; v.poster = c.src + '.jpg';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-label', c[L]);
    v.width = 1280; v.height = 720; v.dataset.src = c.src;
    b.type = 'button'; b.append(el('i')); b.setAttribute('aria-label', PLAY[L]);
    const still = STILL.matches || !near;
    if (still) v.dataset.held = 1;
    b.setAttribute('aria-pressed', String(!still));
    b.addEventListener('click', () => {
      if (v.paused) { delete v.dataset.held; load(v); v.play().catch(() => {}); b.setAttribute('aria-pressed', 'true'); }
      else { v.dataset.held = 1; v.pause(); b.setAttribute('aria-pressed', 'false'); }
    });
    fr.append(v, b); f.append(fr, el('figcaption', '', c[L])); box.append(f);
    if (near && !STILL.matches) near.observe(v);
  }
}

function shots() {
  const box = $('#shots'); box.textContent = '';
  for (const s of SHOTS) {
    const f = el('figure', 'shot'), a = el('a'), img = el('img');
    a.href = s.src; img.src = s.src; img.alt = s[L]; img.loading = 'lazy'; img.width = 960; img.height = 540;
    a.append(img); f.append(a, el('figcaption', '', s[L])); box.append(f);
  }
}

function board() {
  const box = $('#log'), was = [...box.querySelectorAll('details')].map((d) => d.open);
  box.textContent = '';
  UPDATES.forEach((u, i) => {
    const d = el('details', 'upd parch' + (u.upcoming ? ' up' : '')), s = el('summary'), x = u[L] || u.en;
    d.open = was.length ? !!was[i] : i < 3;
    s.append(el('span', 'dt', fmt(u.date, L)));
    if (u.v) { const v = el('span', 'v', L === 'he' ? 'גרסה ' : 'v'); v.append(el('span', 'ltr', u.v)); s.append(v); }
    if (u.upcoming) s.append(el('span', 'soon', T[L].soon));
    s.append(el('span', 'tt', x.title));
    const ul = el('ul'); for (const it of x.items) ul.append(el('li', '', it));
    d.append(s, ul); box.append(d);
  });
}

// the hero snake: a head and a body of segments, each a beat behind the one in front
(() => { const sn = $('#snake'); for (let i = 0; i < 17; i++) { const s = el('i', i === 16 ? 'hd' : ''); s.style.setProperty('--i', 16 - i); sn.append(s); } })();
// the site gives out the launcher only; the launcher installs and updates the game (no game ZIP is linked here)
document.querySelectorAll('.dlbtn').forEach((a) => { a.href = SITE.LAUNCHER_URL || '#'; });
document.querySelectorAll('.macbtn').forEach((a) => { if (SITE.MAC_URL) a.href = SITE.MAC_URL; else a.remove(); });
if (!SITE.MAC_URL) { document.querySelectorAll('.macnote').forEach((e) => e.remove()); document.querySelectorAll('.dlrow').forEach((r) => { r.style.gridTemplateColumns = 'minmax(0, 1fr)'; r.style.width = 'min(440px, 100%)'; }); }

// the living background: a 12 s seamless loop (webm, mp4 for Safari). With motion off it isn't even downloaded,
// and the still town (hero.jpg) stays
const bgv = $('#bgv');
if (matchMedia('(prefers-reduced-motion: reduce)').matches) bgv.remove();
else {
  for (const [src, type] of [['assets/hero.webm', 'video/webm'], ['assets/hero.mp4', 'video/mp4']]) { const s = el('source'); s.src = src; s.type = type; bgv.append(s); }
  bgv.preload = 'auto'; bgv.autoplay = true; bgv.load(); bgv.play().catch(() => {});
}

// language (lang.js): ?lang=he|en|es, then the visitor's last choice, then the browser's, then English; the globe changes it
L = SoLang.pick();
render();
SoLang.mount((l) => { L = l; render(); });
</script>
</body>
</html>
