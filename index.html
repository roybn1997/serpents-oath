<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Serpent's Oath</title>
<meta name="description" content="The Serpent's Oath: המסע של Val להחזיר את Roye הביתה. משחק הרפתקאות בעולם פתוח של יוון המיתולוגית, ל-Windows. מורידים את המשגר, והוא מתקין ומעדכן את המשחק.">
<meta name="theme-color" content="#1a0f17">
<meta property="og:title" content="The Serpent's Oath">
<meta property="og:description" content="Val's journey to bring Roye home. An open-world adventure in mythic Greece, for Windows. Download the launcher; it installs and updates the game.">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="lang.css">
<style>
/* The home page, in the satchel's language (site.css holds the shared tokens, bar, panels, buttons and foot).
   Every path is relative (GitHub Pages). */
html { scroll-padding-top: 66px; }
body { font-size: 17px; }

/* ---------- hero: Athens from above under the satchel's dusk, the town held still while the camera drifts ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; display: grid; place-items: center; min-height: min(88vh, 860px); min-height: min(88svh, 860px); padding: 48px var(--gut) 104px;
  background: #24161e url(assets/hero.jpg) center / cover no-repeat; }
.hero video { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 60% 52% at 50% 46%, rgba(16, 8, 14, .58) 0%, rgba(16, 8, 14, 0) 100%),
              linear-gradient(to top, var(--night) 0%, rgba(26, 15, 23, .72) 20%, rgba(16, 8, 14, 0) 50%),
              linear-gradient(to bottom, rgba(16, 8, 14, .75) 0%, rgba(16, 8, 14, 0) 30%); }
.hero-in { display: grid; justify-items: center; gap: 16px; text-align: center; max-width: 920px; }
.logo { position: relative; padding-inline: 78px; }
.logo h1 { margin: 0; font: 700 clamp(44px, 8.2vw, 100px)/.98 "Pixelify Sans", sans-serif; color: var(--gold); letter-spacing: .02em; direction: ltr; text-wrap: balance;
  text-shadow: 3px 0 0 #1a0f17, -3px 0 0 #1a0f17, 0 3px 0 #1a0f17, 0 -3px 0 #1a0f17, 3px 3px 0 #1a0f17, -3px 3px 0 #1a0f17, 3px -3px 0 #1a0f17, -3px -3px 0 #1a0f17, 0 7px 0 #6b4024, 3px 7px 0 #1a0f17, -3px 7px 0 #1a0f17, 0 10px 0 #1a0f17; }
.logo h1 span { display: inline-block; animation: drop .6s steps(6) both; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
/* the title's underline: the game's gold meander with the bat-wing skull (its title art) */
.band { width: min(560px, 84vw); height: 30px; image-rendering: pixelated;
  background: url(assets/emblem.png) center / 54px 22px no-repeat, linear-gradient(var(--night), var(--night)) center / 84px 30px no-repeat, url(assets/mz-gold.png) 0 50% / 20px 26px repeat-x; }
.tag { margin: 0; font-size: clamp(18px, 2.3vw, 23px); font-weight: 500; color: var(--parch-hi); text-shadow: 0 2px 0 #000, 0 0 18px rgba(0, 0, 0, .6); text-wrap: balance; }

/* torches either side of the title, as in the menu */
.torch { position: absolute; top: 50%; width: 18px; height: 66px; margin-top: -24px; pointer-events: none; image-rendering: pixelated;
  background: linear-gradient(var(--bronze-hi), var(--bronze-hi)) 0 21px / 18px 3px no-repeat, linear-gradient(var(--bronze), var(--bronze)) 0 24px / 18px 6px no-repeat,
              linear-gradient(var(--bronze-dk), var(--bronze-dk)) 6px 30px / 6px 36px no-repeat, linear-gradient(var(--night), var(--night)) 3px 30px / 12px 36px no-repeat; }
.torch.l { left: 8px; } .torch.r { right: 8px; }
.torch::before { content: ""; position: absolute; left: 3px; top: 0; width: 12px; height: 21px; background: linear-gradient(#ffe08a, #ffe08a) 3px 9px / 6px 12px no-repeat, #ff9a2e;
  clip-path: polygon(25% 0, 75% 0, 75% 15%, 100% 15%, 100% 100%, 0 100%, 0 15%, 25% 15%); animation: fl .36s steps(2) infinite alternate; transform-origin: 50% 100%; }
.torch::after { content: ""; position: absolute; left: 50%; top: 10px; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(255, 170, 60, .3) 0%, rgba(255, 140, 40, .1) 40%, rgba(255, 140, 40, 0) 70%); animation: glow .72s steps(3) infinite alternate; }
@keyframes fl { to { transform: scaleY(.78); background-color: #ffb22e; } }
@keyframes glow { to { opacity: .7; transform: scale(.93); } }

/* the downloads: the gold button for Windows, the tab-brown one for the Mac */
.dlrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; width: min(860px, 100%); margin-top: 4px; }
.btn.big { min-height: 72px; padding: 13px 26px 14px; gap: 14px; border-radius: 14px; font: 700 clamp(20px, 2.6vw, 25px)/1.1 var(--font-title); letter-spacing: .02em; }
html[lang="he"] .btn.big { letter-spacing: 0; }
.btn .lbl { display: grid; gap: 4px; text-align: start; }
.btn .lbl > span { white-space: nowrap; }
.btn small { font: 500 14px/1.2 var(--font-body); letter-spacing: 0; opacity: .82; }
.btn .dl { flex: none; width: 20px; height: 23px; background: currentColor; clip-path: polygon(33% 0, 67% 0, 67% 42%, 100% 42%, 50% 88%, 0 42%, 33% 42%); }
.meta { margin: 4px 0 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 12px; font-size: 14.5px; color: var(--tx-2); text-shadow: 0 2px 0 #000; }
.meta b { font: 400 13px/1.6 var(--font-num); color: var(--gold); letter-spacing: .02em; direction: ltr; unicode-bidi: isolate; }
.meta .sep { width: 5px; height: 5px; border-radius: 1px; background: var(--bronze-hi); transform: rotate(45deg); font-size: 0; }
.req { margin: 0; font-size: 14.5px; color: var(--tx-2); text-shadow: 0 2px 0 #000; }

/* the snake that slithers along the hero's foot */
.trail { position: absolute; left: 0; right: 0; bottom: 22px; height: 30px; z-index: 1; overflow: hidden; pointer-events: none; direction: ltr; }
[dir="rtl"] .trail { transform: scaleX(-1); }
.snake { position: absolute; left: -260px; bottom: 3px; display: flex; align-items: flex-end; animation: slither 28s linear infinite; }
.snake i { flex: none; width: 12px; height: 12px; margin-right: -1px; background: var(--teal); box-shadow: inset 0 -3px 0 var(--teal-dk), inset 0 0 0 2px #0b3f3a;
  animation: wave 1s steps(4) infinite; animation-delay: calc(var(--i) * -.11s); }
.snake i:nth-child(3n) { background: #c9aa3a; box-shadow: inset 0 -3px 0 #8a6a1e, inset 0 0 0 2px #0b3f3a; }
.snake i:first-child { width: 8px; height: 6px; }
.snake i:nth-child(2) { width: 10px; height: 9px; }
.snake .hd { position: relative; width: 20px; height: 15px; background: var(--teal) linear-gradient(#1a0f17, #1a0f17) 12px 3px / 3px 3px no-repeat; box-shadow: inset 0 -3px 0 var(--teal-dk), inset 0 0 0 2px #0b3f3a; }
.snake .hd::after { content: ""; position: absolute; right: -7px; top: 8px; width: 7px; height: 2px; background: #d8343b; animation: tongue .9s steps(1) infinite; }
@keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes slither { to { left: calc(100% + 30px); } }
@keyframes tongue { 50% { width: 0; } }
/* the hero's foot: a fine bronze line, fading at both ends */
.rule { position: absolute; left: 0; right: 0; bottom: 18px; height: 1px; z-index: 1; background: linear-gradient(to right, transparent, var(--line-hi) 20%, var(--line-hi) 80%, transparent); }

/* ---------- sections ---------- */
main { display: grid; gap: 76px; padding: 52px 0 24px; }
.sec { width: 100%; max-width: 1100px; margin: 0 auto; padding-inline: var(--gut); display: grid; gap: 22px; }
.lead { margin: -8px auto 0; max-width: 62ch; text-align: center; color: var(--tx-2); text-wrap: balance; }

/* how to run: three panels, each step's number in a satchel slot */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0; padding: 0; list-style: none; counter-reset: none; }
.step { position: relative; display: grid; align-content: start; gap: 8px; padding: 20px 22px 22px; }
.num { width: 52px; height: 52px; display: grid; place-items: center; border-radius: var(--rad-slot); font: 400 20px/1 var(--font-num); color: var(--gold); text-shadow: 0 2px 0 #000;
  background: radial-gradient(circle at 50% 55%, rgba(255, 178, 46, .26), transparent 72%), var(--slot); box-shadow: inset 0 0 0 2px var(--r-legendary), inset 0 0 0 3px var(--ring-dk); }
.step h3 { margin: 6px 0 0; font: 700 20px/1.25 var(--font-title); color: var(--parch-hi); }
.step p { margin: 0; color: var(--tx-2); font-size: 16px; }
.file { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 6px; border-radius: var(--rad-chip); font-weight: 600; color: var(--parch-hi); background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px var(--line-mid); white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
.file img { width: 20px; height: 20px; image-rendering: pixelated; }
.step h3 .file { font-size: .9em; white-space: normal; }
.macnote { max-width: 62ch; margin: 2px auto 0; text-align: center; line-height: 1.7; color: var(--tx-2); }
.macnote b { color: var(--parch-hi); }

.notes { padding: 20px 26px 22px; }
.notes h3 { margin: 0 0 12px; padding-bottom: 10px; font: 700 19px/1.2 var(--font-title); color: var(--gold); letter-spacing: .03em; border-bottom: 1px solid var(--line-lo); text-shadow: 0 2px 0 #000; }
html[lang="he"] .notes h3 { letter-spacing: 0; }
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 30px; }
.notes li { position: relative; padding-inline-start: 22px; color: var(--tx-2); font-size: 16px; }
.notes li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--bronze-hi); transform: rotate(45deg); box-shadow: 0 0 0 2px var(--ring-dk); }
.notes li b { color: var(--parch-hi); }
.notes li.wide { grid-column: 1 / -1; }
.path { font: 600 14.5px/1.6 ui-monospace, Consolas, monospace; color: var(--parch-hi); direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }

/* about: the story, what's in it, and the clips and shots each in a satchel slot */
.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; align-items: start; }
.about .txt { padding: 22px 26px 24px; display: grid; gap: 12px; }
.about .txt p { margin: 0; color: var(--tx); }
.feats { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 14px 0 0; list-style: none; border-top: 1px solid var(--line-lo); }
.feats li { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 7px; border-radius: var(--rad-btn); font-weight: 600; font-size: 14px; color: var(--parch-hi);
  background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line); }
.feats img { width: 22px; height: 22px; image-rendering: pixelated; }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; }
.shot, .clip { margin: 0; display: grid; gap: 8px; align-content: start; }
.shot a, .clip .fr { position: relative; display: block; padding: 4px; border-radius: var(--rad-box); background: var(--slot-2); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--line-mid), 0 8px 22px rgba(0, 0, 0, .35); transition: box-shadow .14s ease-out, transform .14s ease-out; }
.shot a:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--gold), var(--sh-glow); }
.shot img, .clip video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; image-rendering: pixelated; background: var(--card-2) center / cover no-repeat; }
.shot figcaption, .clip figcaption { font-size: 13.5px; line-height: 1.4; color: var(--tx-2); text-align: center; }
.about + .shots { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; }
.clips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; }
.clip .pp { position: absolute; inset-inline-end: 12px; bottom: 12px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--rad-btn); background: rgba(30, 19, 26, .82);
  box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--line-hi); cursor: var(--cur-hand); display: grid; place-items: center; opacity: .8; transition: opacity .12s; }
.clip .pp:hover, .clip .pp:focus-visible { opacity: 1; box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px var(--gold); }
.clip .pp i { width: 4px; height: 12px; background: var(--parch-hi); box-shadow: 6px 0 0 var(--parch-hi); transform: translateX(-3px); }
.clip .pp[aria-pressed="false"] i { width: 0; height: 0; background: none; box-shadow: none; transform: translateX(1px); border: solid transparent; border-width: 7px 0 7px 11px; border-left-color: var(--parch-hi); }
.wikiline { margin: 24px 0 0; display: flex; justify-content: center; }
.wikiline .btn { min-height: 52px; padding-inline: 20px 22px; text-align: center; }
.wikiline img { flex: none; image-rendering: pixelated; }

/* the updates board: the satchel's quest list, one entry per update, newest first and open */
.log { display: grid; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto; }
.upd { border-radius: var(--rad-box); background: rgba(255, 255, 255, .03); box-shadow: inset 0 0 0 1px var(--line-lo); transition: background .12s; }
.upd:hover { background: rgba(255, 255, 255, .05); }
.upd[open] { background: linear-gradient(180deg, rgba(74, 51, 34, .5), rgba(42, 27, 34, .5)); box-shadow: inset 0 0 0 1px var(--line-hi), 0 8px 22px rgba(0, 0, 0, .3); }
.upd summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 16px; border-radius: var(--rad-box); list-style: none; }
.upd summary::-webkit-details-marker { display: none; }
.upd summary::after { content: ""; margin-inline-start: auto; flex: none; width: 8px; height: 8px; border: solid var(--tx-2); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-2px, -2px); transition: transform .14s ease-out; }
.upd:not([open]) summary::after { transform: rotate(-45deg); }
[dir="rtl"] .upd:not([open]) summary::after { transform: rotate(135deg); }
.upd .dt { font: 400 11px/1.5 var(--font-num); color: var(--tx-3); direction: ltr; unicode-bidi: isolate; white-space: nowrap; min-width: 92px; }
.upd .v { padding: 3px 7px 2px; border-radius: var(--rad-key); font: 400 11px/1.3 var(--font-num); color: var(--parch-hi); background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px var(--line-mid); white-space: nowrap; }
html[lang="he"] .upd .v { font: 600 12px/1.3 var(--font-body); }
html[lang="he"] .upd .v .ltr { font: 400 11px/1 var(--font-num); }
.upd .tt { flex: 1 1 260px; min-width: 0; font: 600 16px/1.3 var(--font-body); color: var(--parch); }
.upd[open] .tt, .upd:first-child .tt { color: var(--gold); }
.upd .soon { padding: 3px 8px; border-radius: 6px; font: 600 12px/1.2 var(--font-body); color: #06302c; background: var(--teal); white-space: nowrap; animation: pulse 1.6s steps(2) infinite; }
@keyframes pulse { 50% { background: #74f0dc; } }
.upd.up { box-shadow: inset 0 0 0 1px var(--r-quest), 0 0 0 2px rgba(95, 208, 176, .25); }
.upd ul { margin: 0; padding: 2px 18px 16px; list-style: none; display: grid; gap: 5px; }
.upd li { position: relative; padding-inline-start: 18px; color: var(--tx-2); font-size: 15px; line-height: 1.5; }
.upd li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .6em; width: 6px; height: 6px; border-radius: 2px; background: var(--bronze-hi); transform: rotate(45deg); }

.cta { display: grid; justify-items: center; gap: 18px; text-align: center; }
.cta h2 { margin: 0; font: 700 clamp(26px, 4vw, 38px)/1.15 var(--font-title); color: var(--gold); letter-spacing: .03em; text-shadow: 0 3px 0 #000; }
html[lang="he"] .cta h2 { letter-spacing: 0; }

@media (max-width: 900px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .about { grid-template-columns: minmax(0, 1fr); }
  .notes ul { grid-template-columns: minmax(0, 1fr); }
  .dlrow { grid-template-columns: minmax(0, 1fr); width: min(440px, 100%); }
}
@media (max-width: 720px) {
  .logo { padding-inline: 34px; }
  .torch { transform: scale(.62); transform-origin: 50% 30%; }
  .torch.l { left: -2px; } .torch.r { right: -2px; }
  .shots, .clips { gap: 10px; }
  .shot a, .clip .fr { padding: 3px; border-radius: var(--rad-slot); } .shot img, .clip video { border-radius: 7px; }
  .about + .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .upd summary { padding: 12px 14px; }
  .upd .dt { min-width: 0; }
  .upd ul { padding: 0 14px 16px; }
  .notes, .about .txt { padding: 18px 18px 20px; }
  .step { padding: 18px 18px 20px; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
  .step .num { grid-row: span 1; width: 44px; height: 44px; font-size: 17px; }
  .step h3 { margin: 0; } .step p { grid-column: 1 / -1; }
  main { gap: 58px; padding-top: 40px; }
}
@media (max-width: 420px) {
  .btn.big { padding-inline: 18px; }
  .btn .lbl > span { white-space: normal; }
}
/* motion off: the still town instead of the video, and the snake, torches and stars hold still */
@media (prefers-reduced-motion: reduce) {
  .hero video { display: none; }
  .snake { left: 12%; }
}
</style>
</head>

<section class="hero" id="top">
  <video id="bgv" muted loop playsinline preload="none" poster="assets/hero.jpg" aria-hidden="true" tabindex="-1"></video>

    <div class="logo">
      <i class="torch l" aria-hidden="true"></i><i class="torch r" aria-hidden="true"></i>
      <h1 aria-label="The Serpent's Oath"><span>The</span> <span style="animation-delay:.15s">Serpent's</span> <span style="animation-delay:.3s">Oath</span></h1>
    </div>
    <div class="band" aria-hidden="true"></div>
    <p class="tag" data-t="tagline"></p>
    <div class="dlrow">
      <a class="btn gold big dlbtn" href="#"><i class="dl" aria-hidden="true"></i><span class="lbl"><span data-t="dl_btn"></span><small class="winsz"></small></span></a>
      <a class="btn big macbtn" href="#"><i class="dl" aria-hidden="true"></i><span class="lbl"><span data-t="mac_btn"></span><small class="macsz"></small></span></a>

      else { v.dataset.held = 1; v.pause(); b.setAttribute('aria-pressed', 'false'); }
    });
    fr.append(v, b); f.append(fr, el('figcaption', '', c[L])); box.append(f);
    if (near && !STILL.matches) near.observe(v);
  }
}

function shots() {
  const box = $('#shots'); box.textContent = '';
  for (const s of SHOTS) {
    const f = el('figure', 'shot'), a = el('a'), img = el('img');
    a.href = s.src; img.src = s.src; img.alt = s[L]; img.loading = 'lazy'; img.width = 960; img.height = 540;
    a.append(img); f.append(a, el('figcaption', '', s[L])); box.append(f);
  }
}

function board() {
  const box = $('#log'), was = [...box.querySelectorAll('details')].map((d) => d.open);
  box.textContent = '';
  UPDATES.forEach((u, i) => {
    const d = el('details', 'upd parch' + (u.upcoming ? ' up' : '')), s = el('summary'), x = u[L] || u.en;
    d.open = was.length ? !!was[i] : i < 3;
    s.append(el('span', 'dt', fmt(u.date, L)));
    if (u.v) { const v = el('span', 'v', L === 'he' ? 'גרסה ' : 'v'); v.append(el('span', 'ltr', u.v)); s.append(v); }
    if (u.upcoming) s.append(el('span', 'soon', T[L].soon));
    s.append(el('span', 'tt', x.title));
    const ul = el('ul'); for (const it of x.items) ul.append(el('li', '', it));
    d.append(s, ul); box.append(d);
  });
}

// the hero snake: a head and a body of segments, each a beat behind the one in front
(() => { const sn = $('#snake'); for (let i = 0; i < 17; i++) { const s = el('i', i === 16 ? 'hd' : ''); s.style.setProperty('--i', 16 - i); sn.append(s); } })();
// the site gives out the launcher only; the launcher installs and updates the game (no game ZIP is linked here)
document.querySelectorAll('.dlbtn').forEach((a) => { a.href = SITE.LAUNCHER_URL || '#'; });
document.querySelectorAll('.macbtn').forEach((a) => { if (SITE.MAC_URL) a.href = SITE.MAC_URL; else a.remove(); });
if (!SITE.MAC_URL) { document.querySelectorAll('.macnote').forEach((e) => e.remove()); document.querySelectorAll('.dlrow').forEach((r) => { r.style.gridTemplateColumns = 'minmax(0, 1fr)'; r.style.width = 'min(440px, 100%)'; }); }

// the living background: a 12 s seamless loop (webm, mp4 for Safari). With motion off it isn't even downloaded,
// and the still town (hero.jpg) stays
const bgv = $('#bgv');
if (matchMedia('(prefers-reduced-motion: reduce)').matches) bgv.remove();
else {
  for (const [src, type] of [['assets/hero.webm', 'video/webm'], ['assets/hero.mp4', 'video/mp4']]) { const s = el('source'); s.src = src; s.type = type; bgv.append(s); }
  bgv.preload = 'auto'; bgv.autoplay = true; bgv.load(); bgv.play().catch(() => {});
}

// language (lang.js): ?lang=he|en|es, then the visitor's last choice, then the browser's, then English; the globe changes it
L = SoLang.pick();
render();
SoLang.mount((l) => { L = l; render(); });
</script>
</body>
</html>
